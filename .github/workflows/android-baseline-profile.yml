name: android-baseline-profile

# Generates the Baseline Profile on an emulator (BaselineProfileGenerator in apps/android/benchmark) and opens or
# updates a pull request that commits it to apps/android/app/src/release/generated/baselineProfiles/, so no developer
# needs a device. A profile recorded on an emulator is valid (it lists classes and methods, not timings), but it only
# covers the journeys the generator drives: signed out (login screen) unless the optional test account is configured
# (secrets AEDST_BENCHMARK_EMAIL / AEDST_BENCHMARK_PASSWORD, variable AEDST_BENCHMARK_BASE_URL; see android-nightly.yml).
# Review the diff like code. Once a profile is committed, set the repository variable AEDST_REQUIRE_BASELINE_PROFILE=1.
#
# The PR is created with GITHUB_TOKEN, which does not start other workflows on it: close and reopen the PR (or push an
# empty commit) to run android-ci.yml on it. Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository settings (Settings, Actions, General).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-baseline-profile
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/android

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AEDST_BENCHMARK_EMAIL: ${{ secrets.AEDST_BENCHMARK_EMAIL }}
      AEDST_BENCHMARK_PASSWORD: ${{ secrets.AEDST_BENCHMARK_PASSWORD }}
      AEDST_BENCHMARK_SUBMIT_LABEL: ${{ secrets.AEDST_BENCHMARK_SUBMIT_LABEL }}
      AEDST_BASE_URL: ${{ vars.AEDST_BENCHMARK_BASE_URL }}
      AEDST_BENCHMARK_SUPPRESS_ERRORS: EMULATOR,LOW-BATTERY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0

      - name: Generate ConnectRPC/Protobuf client stubs
        run: make generate

      - name: Copy placeholder google-services.json
        run: cp app/google-services.json.example app/google-services.json

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The profiled build is unpinned (-Paedst.allowUnpinnedRelease) and debug-signed: only the profile text leaves
      # this job, never the APK.
      - name: Generate the baseline profile (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: apps/android
          script: ./gradlew :app:generateBaselineProfile -Paedst.allowUnpinnedRelease=true

      - name: The profile exists and is not empty
        run: |
          dir=app/src/release/generated/baselineProfiles
          ls -l "$dir"
          test -s "$dir/baseline-prof.txt"
          echo "rules: $(wc -l < "$dir/baseline-prof.txt")"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-baseline-profile
          path: |
            apps/android/app/src/release/generated/baselineProfiles/
            apps/android/benchmark/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 30

      # Only the profile directory is staged; a stray build output cannot ride along.
      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: apps/android/app/src/release/generated/baselineProfiles/
          branch: android/baseline-profile
          delete-branch: true
          commit-message: "android: update baseline profile (emulator, API 34)"
          title: "android: update baseline profile"
          body: |
            Generated by `android-baseline-profile.yml` with `:app:generateBaselineProfile` on an API 34 x86_64
            emulator. Review the diff like code (class and method rules only, no timings). The profile covers the
            journeys `BaselineProfileGenerator` drives; startup timings must still be measured on a device
            (`docs/content/android/device-verification.md`).
          labels: android
