name: web-visual

# Nightly visual regression: every Storybook story is screenshot-compared (light
# and dark) against the committed baselines in apps/web/app/visual-baselines.
# Record or refresh the baselines with web-record-baselines.yml (they must come
# from this same runner image). Without baselines the job skips and says so.
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-visual-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web/app

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12.21.0"

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Baselines present?
        id: baselines
        run: |
          if [ -d visual-baselines ] && [ -n "$(ls -A visual-baselines)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no apps/web/app/visual-baselines yet; run web-record-baselines.yml and commit its artifact"
          fi

      - if: steps.baselines.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - if: steps.baselines.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - if: steps.baselines.outputs.present == 'true'
        name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - if: steps.baselines.outputs.present == 'true'
        name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      - if: steps.baselines.outputs.present == 'true'
        name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.baselines.outputs.present == 'true'
        name: Visual regression
        run: pnpm test:visual

      - name: Upload diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-visual-diffs
          path: |
            apps/web/app/**/__diffs__/
            apps/web/app/visual-baselines/
          if-no-files-found: ignore
          retention-days: 7
