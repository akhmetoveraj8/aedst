name: policies-ci

# Repo-wide policy nets that span every app: naming, file size, color literals, i18n parity,
# module boundaries, the ZITADEL AGPL boundary, analytics events, the Claude Code hooks and the
# template/module generators (with their tests). Each app also has its own stricter checks in its own workflow; these are the
# floor. Cheap (no toolchains besides bash/node/go), so they run on every PR.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: policies-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"

jobs:
  naming:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-naming.sh

  file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails on any hand-written file over 500 lines; prints yellow/orange offenders (CONVENTIONS.md, "File size").
      - run: bash scripts/check-file-size.sh

  status-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The measured numbers in docs/content/status.md are generated; a stale block fails here.
      - run: node scripts/status-metrics.mjs --check

  template-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.23.0
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: scripts
      # Removing a platform must leave a tree that still passes the repo-wide checks (core and mobile profiles).
      - run: bash scripts/check-template-profiles.sh
      # The generators' own tests: template-new on copies of the repo per profile, new-module in a temp copy, new-feature in a throwaway tree.
      - run: node --test scripts/test/template-new.test.mjs scripts/new-module.test.mjs scripts/test/new-feature.test.mjs

  color-literals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-color-literals.mjs
      - run: node scripts/check-ui-kit-only.mjs

  i18n-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-i18n-parity.mjs

  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      # The desktop gate (crate boundaries, approved Rust crates, their self-tests) is bash + node, no cargo.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bash scripts/check-boundaries.sh

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.23.0
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: scripts
      - run: node --test scripts/test/check-features-shape.test.mjs scripts/test/check-backlog.test.mjs
      - run: node scripts/check-features.mjs
      - run: node --test scripts/test/check-ui-kit.test.mjs scripts/test/component-docs.test.mjs scripts/test/component-page.test.mjs
      - run: node scripts/check-ui-kit.mjs
      # The component reference (docs/content/ui-kit/components) must match ui-kit.yaml and the kit
      # sources (`task docs:ui-kit`).
      - run: node scripts/ui-kit/component-docs.mjs --check
      # The committed API reference (docs/content/modules/<module>/api.md) must match the .proto
      # files (`task docs:api`). The generator reads buf's descriptor output, so buf is installed
      # from the repo-root mise.toml.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: buf
          cache: true
      - run: node --test scripts/api-docs/descriptor.test.mjs
      - run: node scripts/api-docs/index.mjs --check
      - run: node scripts/check-behavior-fixtures.mjs

  docs-links:
    # Relative markdown links, repo paths mentioned in scripts and workflows (including the paths
    # in AI review prompts under docs/agent/review/), and the no-Cyrillic rule.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --test scripts/check-docs.test.mjs
      - run: node scripts/check-docs.mjs

  contracts:
    # ZITADEL (AGPL-3.0) stays a separate, unmodified image (docs/content/server/licensing-agpl.md,
    # with a negative self-test), and analytics event names match docs/contract/analytics-events.json.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-zitadel-agpl.mjs
      - run: node scripts/check-analytics-events.mjs

  hooks:
    # The Claude Code hooks and settings.json files, fed sample JSON (task check:hooks).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bash scripts/check-hooks.sh

  renovate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # renovate 44.146.3 is the newest git tag of renovatebot/renovate (npm registry not reachable
      # when this was written: UNVERIFIED on npm). Renovate bumps it itself via the npm manager only
      # if it is declared in a package.json; until then, bump by hand.
      - run: npx --yes --package renovate@44.147.0 renovate-config-validator --strict renovate.json

  dangerous-code:
    # Known-bad one-line patterns (eval, raw HTML sinks, shell strings, disabled TLS, literal secrets) and
    # the negative self-test of every rule. Rules and waivers: docs/content/engineering/ai-safe-code.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test scripts/test/check-dangerous-code.test.mjs
      - run: node scripts/check-dangerous-code.mjs
      # Every waiver is listed in the job summary so a reviewer sees each one on every PR.
      - name: List security waivers
        if: always()
        run: |
          { echo "### Security waivers"; node scripts/check-dangerous-code.mjs --list-waivers; } >> "$GITHUB_STEP_SUMMARY"

  sast:
    # Semgrep static analysis (OWASP Top Ten, Go, TypeScript, React, secrets rule packs). Catches data-flow
    # classes the line rules above cannot see. Version verified on PyPI 2026-11-25 (1.186.0). The rule packs
    # are fetched from the Semgrep registry at run time; metrics are off. A finding fails the job: fix it, or
    # suppress one line with `# nosemgrep: <rule-id> - <reason>` after review.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          pipx run --spec semgrep==1.186.0 semgrep scan --error --metrics=off --quiet
          --config p/owasp-top-ten --config p/golang --config p/typescript --config p/react --config p/secrets
          --config .semgrep
          --exclude node_modules --exclude gen --exclude generated --exclude docs --exclude '*.test.*' --exclude '*_test.go'
          apps packages scripts

  secrets:
    # Secret scanning over full history. Config and documented placeholders: .gitleaks.toml.
    # The tool version is pinned in mise.toml (gitleaks); the action ships its own binary.
    # gitleaks-action v2 needs a GITLEAKS_LICENSE secret when the repo belongs to an organization
    # (free for personal accounts): https://gitleaks.io
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
