name: web-record-baselines

# Manual only (`workflow_dispatch`): records the Storybook visual-regression
# baselines (apps/web/app/visual-baselines) on the SAME runner image and Chromium
# that web-visual.yml compares them on. Screenshots differ per OS and browser,
# so baselines recorded on a developer machine would never match CI.
#
#   gh workflow run web-record-baselines.yml     # from the branch to record on
#
# The images are uploaded as an artifact: download it, unpack it into
# apps/web/app/visual-baselines/ and commit. Nothing records during a normal run;
# web-visual.yml only ever compares.
# UNVERIFIED: never run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-record-baselines-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/web/app

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12.21.0"

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Record baselines (light and dark, every story)
        run: pnpm test:visual:update

      - name: Verify the fresh recording
        run: pnpm test:visual

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-visual-baselines
          path: apps/web/app/visual-baselines/
          if-no-files-found: error
          retention-days: 14
