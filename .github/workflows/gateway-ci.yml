name: gateway-ci (experimental, non-blocking until first green run)

# Rust realtime gateway (ADR-0021, apps/server/docs/adr). Nothing here has run on GitHub yet.
on:
  push:
    branches: [main]
    paths: ["apps/gateway/**", "apps/*/Cargo.toml", "scripts/rust/**", "docs/content/library-first/gateway.md", "apps/server/internal/platform/natsbridge/**", ".github/workflows/gateway-ci.yml"]
  pull_request:
    paths: ["apps/gateway/**", "apps/*/Cargo.toml", "scripts/rust/**", "docs/content/library-first/gateway.md", "apps/server/internal/platform/natsbridge/**", ".github/workflows/gateway-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/gateway
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Version of cargo-deny (crates.io, verified 2026-11-01).
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  # Needs no Rust toolchain (bash + node): every direct dependency is in approved-crates.txt and on the Library-First
  # page, versions shared with the desktop app (when the profile keeps it) agree, lint levels and the toolchain agree; with a negative self-test.
  # The script lives in scripts/rust (shared by both Rust projects, kept when desktop is removed). Passes locally; never run on GitHub.
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/rust/check-approved-crates.sh
        working-directory: .

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Toolchain comes from rust-toolchain.toml (rustup is preinstalled on the runner).
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: cargo test

  # Go -> NATS -> Rust -> WebSocket client (needs Docker for Postgres, preinstalled on ubuntu-latest).
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
      - run: rustup show
      - run: cargo build
      - name: Go -> NATS -> Rust -> WebSocket
        working-directory: apps/server
        env:
          AEDST_GATEWAY_BIN: ${{ github.workspace }}/apps/gateway/target/debug/aedst-gateway
        run: go test -tags integration -run TestEventReachesAWebSocketClientThroughTheGateway -v ./internal/platform/natsbridge/

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: cargo install --locked cargo-deny@${CARGO_DENY_VERSION}
      - run: cargo deny check
