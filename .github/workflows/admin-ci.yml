name: admin-ci

# Web admin project (apps/web/admin). Same shape as web-ci.yml, scoped to this
# project: it runs when the project, the shared kit or the workspace config
# changes, or the protos the generated client comes from. The one install is
# for the whole apps/web workspace; versions come from its pnpm catalog.
on:
  push:
    branches: [main]
    paths:
      [
        "apps/web/admin/**",
        "apps/web/shared/**",
        "apps/web/package.json",
        "apps/web/biome.json",
        "apps/web/pnpm-*.yaml",
        "apps/server/api/proto/**",
        ".github/workflows/admin-ci.yml",
      ]
  pull_request:
    paths:
      [
        "apps/web/admin/**",
        "apps/web/shared/**",
        "apps/web/package.json",
        "apps/web/biome.json",
        "apps/web/pnpm-*.yaml",
        "apps/server/api/proto/**",
        ".github/workflows/admin-ci.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web/admin

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12.15.0"
  SITE_URL: http://127.0.0.1:3001

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies (one install for the whole web workspace)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # The generated ConnectRPC stubs live in apps/web/shared/api and are
      # produced by the script the app project hosts.
      - name: Generate ConnectRPC client stubs
        working-directory: apps/web/app
        run: pnpm connect:generate

      - name: Biome (lint + format check)
        run: pnpm lint

      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm typecheck

      - name: knip (unused files/exports/deps)
        run: pnpm knip

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
        run: pnpm build
