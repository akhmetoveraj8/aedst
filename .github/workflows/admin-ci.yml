name: admin-ci

# Web admin project (apps/web/admin): a Vite SPA plus its Hono BFF (server/).
# Same shape as web-ci.yml, scoped to this project: it runs when the project,
# the shared kit or the workspace config changes, or the protos the generated
# client comes from. The one install is for the whole apps/web workspace;
# versions come from its pnpm catalog.
on:
  push:
    branches: [main]
    paths:
      [
        "apps/web/admin/**",
        "apps/web/shared/**",
        "apps/web/package.json",
        "apps/web/biome.json",
        "apps/web/pnpm-*.yaml",
        "apps/server/api/proto/**",
        ".github/workflows/admin-ci.yml",
      ]
  pull_request:
    paths:
      [
        "apps/web/admin/**",
        "apps/web/shared/**",
        "apps/web/package.json",
        "apps/web/biome.json",
        "apps/web/pnpm-*.yaml",
        "apps/server/api/proto/**",
        ".github/workflows/admin-ci.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web/admin

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12.15.0"
  SITE_URL: http://127.0.0.1:3001

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies (one install for the whole web workspace)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # The generated ConnectRPC stubs live in apps/web/shared/api and are
      # produced by the script the app project hosts.
      - name: Generate ConnectRPC client stubs
        working-directory: apps/web/app
        run: pnpm connect:generate

      - name: Biome (lint + format check)
        run: pnpm lint

      - name: Type check (SPA, then the BFF with its own tsconfig)
        run: pnpm typecheck

      - name: knip (unused files/exports/deps)
        run: pnpm knip

      - name: Install Chromium for the browser test project
        run: pnpm test:browser:install

      - name: Tests (unit + browser projects, then the BFF server tests)
        run: pnpm test

      - name: Build (vite build, then the BFF bundle)
        env:
          VITE_SITE_URL: ${{ env.SITE_URL }}
        run: pnpm build:all

      - name: Bundle size report
        run: |
          {
            echo "### admin bundle sizes"
            echo '```'
            du -sh dist dist-server/main.mjs
            find dist/assets -type f '(' -name '*.js' -o -name '*.css' ')' -printf '%s %p\n' | sort -rn | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke the built BFF (health, guard redirect, session 401, nonce parity)
        run: |
          ADMIN_ORIGIN=${{ env.SITE_URL }} PORT=3001 NODE_ENV=production \
            OIDC_ISSUER=http://127.0.0.1:9 OIDC_CLIENT_ID=ci \
            OIDC_STATE_SECRET=ci-only-state-secret-ci-only-state-secret \
            node dist-server/main.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          up=0
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3001/api/healthz > /dev/null; then up=1; break; fi
            sleep 0.5
          done
          if [ "$up" != 1 ]; then echo "BFF did not become healthy"; exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/auth/session)" = 401
          curl -sf -D headers.txt -o body.html http://127.0.0.1:3001/en/forbidden
          nonce=$(grep -i '^content-security-policy:' headers.txt | grep -o "nonce-[A-Za-z0-9+/=]*" | head -1 | cut -c7-)
          test -n "$nonce"
          grep -q "nonce=\"$nonce\"" body.html
          # `! cmd` never fails a step under errexit, so test the placeholder explicitly.
          if grep -q __CSP_NONCE__ body.html; then echo "unreplaced nonce placeholder"; exit 1; fi
          # script-src must not allow inline code or eval.
          script_src=$(grep -i '^content-security-policy:' headers.txt | tr ';' '\n' | grep -i "script-src")
          if echo "$script_src" | grep -Eq "unsafe-inline|unsafe-eval"; then echo "script-src is not strict: $script_src"; exit 1; fi
