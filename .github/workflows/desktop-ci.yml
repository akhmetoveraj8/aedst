name: desktop-ci

on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "apps/server/api/proto/**", "apps/server/buf.lock", ".github/workflows/desktop-ci.yml", "scripts/check-naming.sh"]
  pull_request:
    paths: ["apps/desktop/**", "apps/server/api/proto/**", "apps/server/buf.lock", ".github/workflows/desktop-ci.yml", "scripts/check-naming.sh"]
  workflow_dispatch:
  # Called by desktop-release.yml for a tagged release: same build, plus the updater (Velopack) and the update keys.
  workflow_call:
    inputs:
      release:
        description: "Build the release flavour (Velopack updater, update keys, reproducible-build epoch)"
        type: boolean
        default: false

# Least privilege: nothing here writes to the repo, packages or the API.
permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/desktop
    shell: bash

env:
  CMAKE_VERSION: "4.4.5"
  # Exact PyPI release of the clang-format wheel (the formatter is pinned to the patch version, not to a distro package).
  CLANG_FORMAT_VERSION: "23.1.3"
  # Qt comes from official binaries via aqtinstall (install-qt-action), never
  # from a package manager. The version is read from apps/desktop/qt-version.txt
  # (single source of truth, also enforced by cmake/AedstQtVersion.cmake).
  # C++ libraries come from vcpkg manifest mode (vcpkg.json) with a file-based binary
  # cache persisted by actions/cache (the x-gha provider depended on the retired GitHub
  # cache v1 API). See docs/adr/0002-dependency-management.md.
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
  # Headless Qt Quick (QtQuickTest + offscreen QPA) on GPU-less runners.
  QT_QUICK_BACKEND: software

jobs:
  # ---------------------------------------------------------------------------
  # Fast static checks. No build tree needed.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # License gate: no GPL-only Qt module without a documented waiver (compliance/policy.json, docs/compliance.md).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Qt module licenses
        run: node scripts/compliance/compliance.mjs qt

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxkbcommon0 libegl1 libfontconfig1

      # clang-format from the PyPI wheel (a static LLVM build): the same bytes on every runner image, unlike the
      # distro package whose version follows the runner OS. scripts/check-format.sh fails if the version differs.
      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format-venv"
          "$RUNNER_TEMP/clang-format-venv/bin/pip" install --disable-pip-version-check "clang-format==${CLANG_FORMAT_VERSION}"
          echo "CLANG_FORMAT=$RUNNER_TEMP/clang-format-venv/bin/clang-format" >> "$GITHUB_ENV"

      # qmllint/qmlformat ship with Qt (never from apt).
      - name: Read pinned Qt version
        run: echo "QT_VERSION=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          # Add-on modules: Aedst::Media (MediaPlayer, VideoOutput, QVideoSink), Aedst::Oidc (QtNetworkAuth).
          modules: qtmultimedia qtnetworkauth
          cache: true

      - name: clang-format
        run: bash ./scripts/check-format.sh
        env:
          CLANG_FORMAT_VERSION: ${{ env.CLANG_FORMAT_VERSION }}

      - name: File naming (apps/desktop only)
        run: bash ./scripts/check-naming.sh

      - name: C++ subset (features all compilers support)
        run: bash ./scripts/check-cxx-subset.sh

      - name: Feature target and layer boundaries
        run: bash ./scripts/check-feature-boundaries.sh

      # Mandatory-library-per-concern gates (docs/content/library-first/desktop.md, "Enforced rules"). Pure
      # bash/awk/node, no build tree. Escape hatch: `// aedst-allow: <reason>`.
      - name: Forbidden APIs (TLS, threads, QNAM, logging, qmlRegister, dependency pins)
        run: bash ./scripts/check-forbidden-apis.sh

      - name: QML design-system components (no raw controls in features/app)
        run: bash ./scripts/check-qml-components.sh

      - name: QML accessibility (role and name on interactive controls)
        run: bash ./scripts/check-qml-accessibility.sh

      - name: Frozen SQLite migrations (hashes)
        run: bash ./scripts/check-migration-hashes.sh

      - name: Every CMake-named source file is tracked by git
        run: bash ./scripts/check-tracked-sources.sh

      - name: Module lists in the docs match Modules/
        run: bash ./scripts/check-docs-modules.sh

      # Source strings vs catalogs without Qt (shrink-only baseline scripts/i18n-baseline.json), then the
      # authoritative lupdate -no-obsolete comparison in a temporary copy (needs the Qt tools installed above).
      - name: i18n source strings vs catalogs
        run: node ./scripts/check-i18n-extract.mjs

      - name: i18n lupdate comparison
        run: bash ./scripts/check-i18n-lupdate.sh
        env:
          QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}

      # Every gate above must still fail on its fixture (scripts/selftest/fixtures) and pass on the real tree.
      - name: Gate self-tests (negative fixtures)
        run: bash ./scripts/selftest/run-selftests.sh
        env:
          QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}

      # The message types are generated from the protos at build time; the
      # hand-written procedure table (Contract/methods.hpp) must list exactly
      # the RPCs declared in apps/server/api/proto.
      - name: Proto freshness (procedure table vs protos)
        run: bash ./scripts/check-proto-freshness.sh

      # third_party/protovalidate must match the commit pinned in
      # apps/server/buf.lock (needs buf + network).
      - name: Protovalidate pin
        run: bash ./scripts/check-protovalidate-pin.sh

      # Blocking. Without a build tree first-party QML imports are downgraded via
      # .qmllint.ini; the `test (gcc-debug)` job re-runs it with the generated modules.
      - name: qmllint
        run: bash ./scripts/check-qml-lint.sh

      # Advisory until the tree has had one `qmlformat -i` pass.
      - name: qmlformat (advisory)
        continue-on-error: true
        run: bash ./scripts/check-qml-lint.sh --format

  # ---------------------------------------------------------------------------
  # Build + test matrix. kind=test: normal debug builds (warnings are errors);
  # kind=sanitize: ASan/UBSan/TSan presets; kind=coverage: gcov + gcovr report.
  # Every kind runs ALL ctest labels (unit, qttest, qmltest).
  # ---------------------------------------------------------------------------
  test:
    needs: [lint]
    name: ${{ matrix.kind }} (${{ matrix.preset }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: msvc-debug, os: windows-latest, kind: test }
          - { preset: gcc-debug, os: ubuntu-latest, kind: test }
          # The opt-in code paths (velopack_installer.cpp, plugin_loader.cpp) are OFF by default, so they would
          # compile in no PR. This single entry builds and tests them; the Velopack SDK is fetched by CMake.
          - { preset: gcc-debug, os: ubuntu-latest, kind: test, variant: optin, cmake_args: "-DAEDST_ENABLE_VELOPACK=ON -DAEDST_ENABLE_RUNTIME_PLUGINS=ON" }
          - { preset: clang-debug, os: ubuntu-latest, kind: test }
          - { preset: gcc-asan, os: ubuntu-latest, kind: sanitize }
          - { preset: clang-asan, os: ubuntu-latest, kind: sanitize }
          - { preset: clang-tsan, os: ubuntu-latest, kind: sanitize }
          - { preset: coverage, os: ubuntu-latest, kind: coverage }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      # GL/xkb/EGL: Qt runtime. libsecret + dbus: AedstPlatform (Linux secret service,
      # notifications, autostart). clang sanitizer runtimes: libclang-rt-dev
      # (UNVERIFIED that the runner's preinstalled clang major matches the apt default).
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 libfontconfig1 \
            libsecret-1-dev libdbus-1-dev pkg-config
          if [[ "${{ matrix.preset }}" == clang-* ]]; then
            sudo apt-get install -y clang libclang-rt-dev clang-tidy clang-tools
          fi

      # Ninja + MSVC: put cl.exe and the Windows SDK on PATH.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      - name: Read pinned Qt version
        run: echo "QT_VERSION=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          # Add-on modules: Aedst::Media (MediaPlayer, VideoOutput, QVideoSink), Aedst::Oidc (QtNetworkAuth).
          modules: qtmultimedia qtnetworkauth
          cache: true

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('apps/desktop/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.preset }}-

      - name: Point VCPKG_ROOT at the runner's vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Install gcovr
        if: matrix.kind == 'coverage'
        run: pipx install gcovr

      # Warnings are errors in CI (AEDST_WARNINGS_AS_ERRORS); local presets keep them as warnings.
      - name: Configure (vcpkg manifest install runs here)
        run: cmake --preset ${{ matrix.preset }} -DAEDST_WARNINGS_AS_ERRORS=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Blocking gate with a checked-in baseline: scripts/run-clang-tidy.sh,
      # CLANG_TIDY_BASELINE.md. Uses the clang-debug compile database.
      - name: clang-tidy (blocking)
        if: matrix.preset == 'clang-debug'
        run: bash ./scripts/run-clang-tidy.sh build/clang-debug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.preset == 'clang-debug'
        with:
          name: clang-tidy-log
          path: apps/desktop/clang-tidy.log
          if-no-files-found: warn

      # The clang-debug database never compiles the Windows-only translation units (DPAPI, toast, dbghelp), so they would
      # never be analysed. Second pass over the MSVC database, restricted to those files, with its own baseline.
      # UNVERIFIED until the first run: clang-tidy runs in clang-cl mode on cl.exe commands, and the LLVM on windows-latest
      # may not ship run-clang-tidy.py at this path (adjust RUN_CLANG_TIDY / AEDST_TIDY_EXTRA_ARGS from the evidence).
      - name: clang-tidy (MSVC database, Windows-only code)
        if: matrix.preset == 'msvc-debug'
        run: bash ./scripts/run-clang-tidy.sh build/msvc-debug
        env:
          AEDST_TIDY_ONLY_WINDOWS: "1"
          AEDST_TIDY_BASELINE: scripts/clang-tidy-baseline-msvc.txt
          AEDST_TIDY_LOG: clang-tidy-msvc.log
          RUN_CLANG_TIDY: C:/Program Files/LLVM/bin/run-clang-tidy.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.preset == 'msvc-debug'
        with:
          name: clang-tidy-msvc-log
          path: apps/desktop/clang-tidy-msvc.log
          if-no-files-found: ignore

      # With the build tree the generated QML modules (design system, app) resolve.
      - name: qmllint (with build tree)
        if: matrix.preset == 'gcc-debug'
        run: bash ./scripts/check-qml-lint.sh
        env:
          BUILD_DIR: build/gcc-debug

      # All labels: unit (GoogleTest), qttest (Qt Test), qmltest (QtQuickTest, offscreen).
      # Sanitizer presets export ASAN_/LSAN_/UBSAN_/TSAN_OPTIONS with suppressions from
      # cmake/sanitizers/ (see CMakePresets.json).
      - name: Test
        if: matrix.kind != 'coverage'
        run: ctest --preset ${{ matrix.preset }}

      - name: Coverage report (runs tests, then gcovr)
        if: matrix.kind == 'coverage'
        run: |
          cmake --build --preset coverage-report | tee coverage.log
          { echo "### Coverage (gcovr, Modules/ + App/)"; echo; echo '```'; grep -E "^(lines|functions|branches):" coverage.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.kind == 'coverage'
        with:
          name: coverage-report
          path: apps/desktop/build/coverage/coverage
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Performance gate: cold start, memory, scroll smoothness and the Qt Test micro-benchmarks against perf/budgets.json
  # and perf/baseline.json (scripts/perf/run-perf.mjs, docs/performance.md). Runs on main, on manual dispatch and on EVERY
  # pull request: a PR gets the micro-benchmarks (`--only micro`, regression vs perf/baseline.json); the full gate (startup,
  # memory, scroll) runs on main, on dispatch and on PRs that carry the `perf` label (it builds a Release tree with tests).
  # The budgets are PROVISIONAL until the first run has produced numbers; see perf/budgets.json.
  # ---------------------------------------------------------------------------
  perf:
    needs: [test]
    name: perf (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 libfontconfig1 \
            libsecret-1-dev libdbus-1-dev pkg-config xvfb mesa-utils

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      - name: Read pinned Qt version
        run: echo "QT_VERSION=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia qtnetworkauth
          cache: true

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-bench-${{ hashFiles('apps/desktop/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-bench-

      - name: Point VCPKG_ROOT at the runner's vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Configure
        run: cmake --preset bench

      - name: Build
        run: cmake --build --preset bench

      # Frame times need a window system: xvfb with Mesa's software GL on Linux (absolute numbers are indicative there; the
      # regression comparison is against a baseline taken on the same runner type), the desktop session on Windows.
      - name: Performance gate
        env:
          # Unlabelled pull requests: micro-benchmarks only. Everything else: the full gate.
          PERF_ONLY: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'perf') && 'micro' || 'startup,scroll,micro' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" node scripts/perf/run-perf.mjs --build-dir build/bench --only "$PERF_ONLY" --report perf-report.json
          else
            node scripts/perf/run-perf.mjs --build-dir build/bench --only "$PERF_ONLY" --report perf-report.json
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-report-${{ runner.os }}
          path: apps/desktop/perf-report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Release packages (+ symbols, + optional signing).
  # ---------------------------------------------------------------------------
  package:
    needs: [lint, test]
    name: package (${{ matrix.preset }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: msvc-release, os: windows-latest, cpack: "NSIS;ZIP" }
          - { preset: gcc-release, os: ubuntu-latest, cpack: "DEB;RPM;TGZ" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 libfontconfig1 \
            libsecret-1-dev libdbus-1-dev pkg-config rpm

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      - name: Read pinned Qt version
        run: echo "QT_VERSION=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          # Add-on modules: Aedst::Media (MediaPlayer, VideoOutput, QVideoSink), Aedst::Oidc (QtNetworkAuth).
          modules: qtmultimedia qtnetworkauth
          cache: true

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('apps/desktop/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.preset }}-

      - name: Point VCPKG_ROOT at the runner's vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      # Secrets cannot be used in `if:`; map them into env here and derive one flag.
      # On fork PRs the secrets are empty, so the flag stays unset and packages are unsigned.
      - name: Detect signing secrets
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          has=false
          case "$RUNNER_OS" in
            Windows)
              if [ -n "$WINDOWS_CERT_PFX_BASE64" ] && [ -n "$WINDOWS_CERT_PASSWORD" ]; then has=true; fi ;;
            Linux)
              if [ -n "$GPG_PRIVATE_KEY" ]; then has=true; fi ;;
          esac
          echo "HAS_SIGNING_SECRETS=$has" >> "$GITHUB_ENV"
          echo "Signing secrets present for $RUNNER_OS: $has"

      # Telemetry keys are baked into release builds from repository secrets (empty on
      # forks: Sentry and PostHog then stay off at runtime). Neither is a credential
      # for anything but event ingestion, but they stay out of the repo.
      # Reproducible builds: packagers (cpack, tar, dpkg-deb, rpmbuild) take their timestamps from the commit.
      - name: Fix SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # The release flavour embeds the update public keys (a repository VARIABLE: public, not a secret), the manifest and
      # feed URLs, and the Velopack updater. See docs/signing.md and docs/adr/0029-delivery-updates-signing.md.
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          "-DAEDST_SENTRY_DSN=${AEDST_SENTRY_DSN}"
          "-DAEDST_POSTHOG_KEY=${AEDST_POSTHOG_KEY}"
          "-DAEDST_SENTRY_ENVIRONMENT=${{ inputs.release && (contains(github.ref_name, '-') && 'beta' || 'production') || 'ci' }}"
          "-DAEDST_ENABLE_VELOPACK=${{ inputs.release && 'ON' || 'OFF' }}"
          "-DAEDST_UPDATE_PUBLIC_KEYS=${{ inputs.release && vars.AEDST_UPDATE_PUBLIC_KEYS || '' }}"
          "-DAEDST_UPDATE_MANIFEST_URL=${{ inputs.release && vars.AEDST_UPDATE_MANIFEST_URL || '' }}"
          "-DAEDST_UPDATE_FEED_URL=${{ inputs.release && vars.AEDST_UPDATE_FEED_URL || '' }}"
        env:
          AEDST_SENTRY_DSN: ${{ secrets.AEDST_DESKTOP_SENTRY_DSN }}
          AEDST_POSTHOG_KEY: ${{ secrets.AEDST_DESKTOP_POSTHOG_KEY }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Third-party notices + SPDX SBOM from vcpkg's per-port SBOMs and compliance/components.json; strict = an undeclared,
      # denied or unlisted license fails the build. They are installed into the package by cmake/AedstPackaging.cmake.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Third-party notices and SBOM
        run: >-
          node scripts/compliance/compliance.mjs notices
          --installed build/${{ matrix.preset }}/vcpkg_installed --build-dir build/${{ matrix.preset }}
          --out build/${{ matrix.preset }}/compliance --strict
      - name: FFmpeg build flags (Qt Multimedia backend)
        run: node scripts/compliance/compliance.mjs ffmpeg --dir "$QT_ROOT_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance-${{ runner.os }}
          path: apps/desktop/build/${{ matrix.preset }}/compliance/*
          if-no-files-found: error

      # Sign the binary BEFORE cpack so the installer embeds the signed exe.
      - name: Sign aedst-desktop.exe (Authenticode)
        if: runner.os == 'Windows' && env.HAS_SIGNING_SECRETS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./packaging/windows/sign.ps1 -Files build/${{ matrix.preset }}/App/aedst-desktop.exe

      - name: Package (cpack)
        working-directory: apps/desktop/build/${{ matrix.preset }}
        run: cpack -G "${{ matrix.cpack }}"

      - name: Sign the Windows installer
        if: runner.os == 'Windows' && env.HAS_SIGNING_SECRETS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $installers = Get-ChildItem build/${{ matrix.preset }}/packages -Filter *.exe | ForEach-Object { $_.FullName }
          ./packaging/windows/sign.ps1 -Files $installers

      # Detached GPG signatures next to the .deb/.rpm/.tar.gz (verify: gpg --verify x.asc x).
      - name: Sign Linux packages (detached GPG)
        if: runner.os == 'Linux' && env.HAS_SIGNING_SECRETS == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          shopt -s nullglob
          for f in build/${{ matrix.preset }}/packages/*.deb build/${{ matrix.preset }}/packages/*.rpm build/${{ matrix.preset }}/packages/*.tar.gz; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE:-}" --armor --detach-sign "$f"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aedst-desktop-${{ runner.os }}
          path: apps/desktop/build/${{ matrix.preset }}/packages/*
          if-no-files-found: error

      # PDB (Windows), .debug split by build-id (Linux): produced by the
      # aedst_split_debug_symbols target (cmake/AedstBuildOptions.cmake). Keep them: a
      # release crash dump is unreadable without the symbols of THAT build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aedst-symbols-${{ runner.os }}
          path: apps/desktop/build/${{ matrix.preset }}/symbols
          if-no-files-found: error
          retention-days: 90

      # Sentry symbolication: upload this build's PDB / .debug so crashpad
      # minidumps resolve to functions and lines. The release name must match
      # SentryConfig.release ("aedst-desktop@<version>", App/src/main.cpp). Skipped
      # when the secrets are absent (forks, template users without Sentry).
      # Secrets cannot be used in `if:` (same pattern as "Detect signing secrets").
      - name: Detect Sentry upload credentials
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_DESKTOP_PROJECT }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            echo "HAS_SENTRY_UPLOAD=true" >> "$GITHUB_ENV"
          fi

      - name: Upload debug symbols to Sentry
        if: env.HAS_SENTRY_UPLOAD == 'true' && inputs.release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_DESKTOP_PROJECT }}
        run: |
          version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          # release == SentryConfig.release in App/src/main.cpp: "aedst-desktop@" + the package version (PROJECT_VERSION),
          # which the release workflow has already checked against the tag. The binary reports the same string.
          exe="build/${{ matrix.preset }}/App/aedst-desktop"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          built=$("$exe" --version 2>/dev/null | head -1 || true)
          if [ -n "$built" ] && [ "$built" != "$version" ]; then
            echo "::error::the binary reports $built but CMakeLists.txt says $version"; exit 1
          fi
          release="aedst-desktop@${version}"
          npx --yes @sentry/cli@3.8.0 releases new "$release"
          npx --yes @sentry/cli@3.8.0 debug-files upload --include-sources --wait --release "$release" \
            "build/${{ matrix.preset }}/symbols" "build/${{ matrix.preset }}/App"
          npx --yes @sentry/cli@3.8.0 releases finalize "$release"

  # ---------------------------------------------------------------------------
  # Install the produced package on a clean runner (no compiler, no Qt), run it,
  # uninstall it, and check nothing is left behind. main.cpp must implement
  # `aedst-desktop --version` (print AEDST_VERSION, exit 0, no display).
  # ---------------------------------------------------------------------------
  install-verify:
    needs: [package]
    name: install-verify (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read project version
        run: |
          version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          [ -n "$version" ] || { echo "could not read the project version"; exit 1; }
          echo "AEDST_VERSION=$version" >> "$GITHUB_ENV"

      # Same major as the upload-artifact@v4 already used in this repo's workflows.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aedst-desktop-${{ runner.os }}
          path: apps/desktop/verify-pkg

      - name: Verify (Linux .deb)
        if: runner.os == 'Linux'
        run: bash ./scripts/verify-install-linux.sh verify-pkg/*.deb "$AEDST_VERSION"

      - name: Verify (Windows NSIS installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem verify-pkg -Filter *.exe | Select-Object -First 1).FullName
          ./scripts/verify-install-windows.ps1 -Installer $installer -Version $env:AEDST_VERSION

  # Explicit scope cuts, not wired here:
  # - AppImage / Flatpak: need linuxdeploy / flatpak-builder + KDE runtime and a real icon
  #   (see apps/desktop/App/resources/icons/README.md); `package_appimage` / `package_flatpak`
  #   targets exist for local use.
  # - MSIX: `package_msix` / `sign_msix` targets exist; not built in CI.
  # - Publishing (GitHub Release / update feed upload): packages are artifacts only.
