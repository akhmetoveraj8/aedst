name: web-mutation-nightly

# Stryker mutation testing of the pure-logic core (apps/web/app/stryker.config.mjs).
# Never per PR (a run takes minutes): nightly plus on demand. A manual run may
# narrow the scope with `mutate` (comma-separated globs relative to apps/web/app,
# e.g. "../shared/lib/auth/**/*.ts") to mutate only the critical modules a change touched.

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      mutate:
        description: "Optional --mutate globs (default: the modules in stryker.config.mjs)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: web-mutation-nightly-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web/app

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12.23.0"

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies (one install for the whole web workspace)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      # Fails below thresholds.break in stryker.config.mjs.
      - name: Stryker mutation run
        env:
          MUTATE: ${{ inputs.mutate }}
        run: |
          if [ -n "$MUTATE" ]; then
            pnpm test:mutation --mutate "$MUTATE"
          else
            pnpm test:mutation
          fi

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-mutation-report
          path: apps/web/app/reports/mutation/
          retention-days: 14
