name: marketing-ci

# Web marketing project (apps/web/marketing). Same shape as web-ci.yml, scoped to this
# project: it runs when the project, the shared kit or the workspace config
# changes, or the protos the generated client comes from. The one install is
# for the whole apps/web workspace; versions come from its pnpm catalog.
on:
  push:
    branches: [main]
    paths:
      [
        "apps/web/marketing/**",
        "apps/web/shared/**",
        "apps/web/package.json",
        "apps/web/biome.json",
        "apps/web/pnpm-*.yaml",
        "apps/server/api/proto/**",
        "apps/web/app/scripts/check-feature-boundaries.sh",
        ".github/workflows/marketing-ci.yml",
      ]
  pull_request:
    paths:
      [
        "apps/web/marketing/**",
        "apps/web/shared/**",
        "apps/web/package.json",
        "apps/web/biome.json",
        "apps/web/pnpm-*.yaml",
        "apps/server/api/proto/**",
        "apps/web/app/scripts/check-feature-boundaries.sh",
        ".github/workflows/marketing-ci.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web/marketing

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12.23.0"
  SITE_URL: http://127.0.0.1:3002

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies (one install for the whole web workspace)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # The generated ConnectRPC stubs live in apps/web/shared/api and are
      # produced by the script the app project hosts.
      - name: Generate ConnectRPC client stubs
        working-directory: apps/web/app
        run: pnpm connect:generate

      - name: Biome (lint + format check)
        run: pnpm lint

      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm typecheck

      - name: knip (unused files/exports/deps)
        run: pnpm knip

      # Layering, module entries and project isolation; import cycles are Biome's
      # noImportCycles (pnpm lint), unused files are knip's.
      - name: Module and feature boundaries
        run: pnpm check:feature-boundaries

      # Right-to-left: no physical Tailwind utilities (ml-, left-, text-left);
      # no Base64 images. Negative fixtures: apps/web/app `pnpm check:selftest`.
      - name: Source bans (RTL utilities, Base64 images)
        run: pnpm check:source

      - name: Date control (sitemap lastModified, legal pages)
        run: pnpm check:dates

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
        run: pnpm build

      # Performance budget: fails the PR that adds the weight.
      - name: Client bundle and font budget
        run: pnpm check:bundle

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Rendered HTML of every public page in all five locales (canonical,
      # hreflang with x-default, og:url, JSON-LD types, one h1) and axe at
      # WCAG 2.2 AA including the right-to-left pages. Playwright starts
      # `scripts/serve-out.mjs` on the static export built above, with the
      # generated per-page CSP (playwright.config.ts); csp.spec.ts asserts it.
      - name: Playwright e2e (SEO tags and accessibility)
        env:
          CI: "1"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketing-playwright-report
          path: apps/web/marketing/playwright-report/
          retention-days: 7

      # lighthouserc.json: performance and SEO >= 0.95, accessibility 1,
      # LCP/CLS/TBT, page weight, fonts, request count and TTFB.
      - name: Lighthouse CI
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketing-lighthouse-reports
          path: apps/web/marketing/.lighthouseci/
          retention-days: 7
