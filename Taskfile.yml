version: "3"

# Single entry point (go-task). Per-app logic lives in each app's own
# Taskfile/Makefile/package.json scripts; this file only delegates.
# apps/server has a Taskfile and is included; the other apps expose
# Makefile / pnpm / Gradle / CMake entry points, wrapped in namespaced tasks
# below (web:*, app:*, admin:*, marketing:*, android:*, apple:*, desktop:*).
#
# PROFILE: the aggregate tasks (generate, lint, test, build, check) run the Core
# profile (server + web + design tokens) by default. Android, Apple and Desktop are
# frozen until each has a first green CI run; include them with `task lint PROFILE=full`.

includes:
  server:
    taskfile: apps/server/Taskfile.yml
    dir: apps/server

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  setup:
    desc: Install dependencies and git hooks for the current machine.
    cmds:
      - lefthook install
      - pnpm install --dir scripts --ignore-workspace --frozen-lockfile --silent
      - pnpm --dir apps/web install --frozen-lockfile
      - pnpm --dir docs install --frozen-lockfile
      - task: generate

  generate:
    desc: "Regenerate buf/sqlc outputs and design tokens (Core profile: server, web, tokens; PROFILE=full adds android, apple on macOS, desktop)."
    cmds:
      - task: server:gen
      - task: web:generate
      - task: tokens:build
      - task: generate:frozen

  generate:frozen:
    desc: Regenerate the outputs of the frozen platforms (android, apple on macOS). Runs only with PROFILE=full.
    status:
      - '{{if eq (.PROFILE | default "core") "full"}}false{{else}}true{{end}}'
    cmds:
      - task: android:generate
      - task: apple:generate

  lint:
    desc: Lint the Core profile (server, web); PROFILE=full adds android, apple, desktop (only where the toolchain exists).
    cmds:
      - task: server:lint
      - task: gateway:lint
      - task: web:lint
      - task: lint:frozen

  lint:frozen:
    desc: Lint the frozen platforms (android, apple, desktop). Runs only with PROFILE=full.
    status:
      - '{{if eq (.PROFILE | default "core") "full"}}false{{else}}true{{end}}'
    cmds:
      - task: android:lint
      - task: apple:lint
      - task: desktop:lint

  test:
    desc: Unit tests of the Core profile (server, web); PROFILE=full adds android, apple, desktop.
    cmds:
      - task: server:test
      - task: gateway:test
      - task: web:test
      - task: test:frozen

  test:frozen:
    desc: Unit tests of the frozen platforms (android, apple, desktop). Runs only with PROFILE=full.
    status:
      - '{{if eq (.PROFILE | default "core") "full"}}false{{else}}true{{end}}'
    cmds:
      - task: android:test
      - task: apple:test
      - task: desktop:test

  build:
    desc: Build the Core profile (server, web); PROFILE=full adds android, apple, desktop (only where the toolchain exists).
    cmds:
      - task: server:build
      - task: gateway:build
      - task: web:build
      - task: build:frozen

  build:frozen:
    desc: Build the frozen platforms (android, apple, desktop). Runs only with PROFILE=full.
    status:
      - '{{if eq (.PROFILE | default "core") "full"}}false{{else}}true{{end}}'
    cmds:
      - task: android:build
      - task: apple:build
      - task: desktop:build

  audit:status:
    desc: Validate docs/audit/2026-10-08-backlog.md (every item has a status, none skipped) and print counters.
    cmds:
      - node scripts/check-backlog.mjs

  check:
    desc: Cheap static checks (naming, file size, colors, i18n, boundaries, knip, migrations, tokens, infra fmt). Core profile by default; PROFILE=full adds the android, apple and desktop gates.
    cmds:
      - task: check:naming
      - task: check:file-size
      - task: check:status
      - task: check:colors
      - task: check:i18n
      - task: check:boundaries
      - task: check:features
      - task: check:ui-kit
      - task: check:ui-kit-only
      - task: check:behavior
      - task: check:analytics
      - task: check:dangerous
      - task: check:hooks
      - task: check:docs
      - task: check:api-docs
      - task: check:agpl
      - task: check:gates
      - task: check:gates:frozen
      - task: web:knip
      - task: server:lint:migrations
      - task: tokens:check
      - task: infra:fmt

  check:gates:
    desc: Library-First gates for the Core profile (web forms/selftest, server lint selftest), each with its negative self-test.
    cmds:
      - pnpm --dir apps/web/app check:forms
      - task: web:check:source
      - pnpm --dir apps/web/app check:selftest
      - task: server:lint:selftest

  check:gates:frozen:
    desc: Static gates of the frozen platforms (apple custom rules, android gates, desktop boundaries and Rust dependency policy). Runs only with PROFILE=full.
    status:
      - '{{if eq (.PROFILE | default "core") "full"}}false{{else}}true{{end}}'
    cmds:
      - bash apps/apple/scripts/check-swiftlint-rules-static.sh
      - bash apps/apple/scripts/check-apple-sensitive-apis.sh
      - bash apps/apple/scripts/check-dependencies.sh
      - bash apps/apple/scripts/check-feature-layers.sh
      - bash apps/android/scripts/test-gates.sh
      - bash apps/desktop/scripts/check-feature-boundaries.sh

  check:naming:
    desc: File/directory naming conventions (CONVENTIONS.md).
    cmds:
      - bash scripts/check-naming.sh

  check:file-size:
    desc: File-size policy (CONVENTIONS.md, File size; red over 500 lines fails). Limits in scripts/file-size.config.
    cmds:
      - bash scripts/check-file-size.sh {{.CLI_ARGS}}

  check:status:
    desc: Measured numbers in docs/content/status.md match the tree (regenerate with `node scripts/status-metrics.mjs`).
    cmds:
      - node scripts/status-metrics.mjs --check

  check:template-profiles:
    desc: Generate the core and mobile profiles with template-new and run the repo-wide checks inside them (proves that removing a platform works).
    cmds:
      - bash scripts/check-template-profiles.sh {{.CLI_ARGS}}

  check:colors:
    desc: No color literals in hand-written UI code (use design tokens). Allowlist in scripts/color-literals.allowlist.
    cmds:
      - node scripts/check-color-literals.mjs {{.CLI_ARGS}}

  check:ui-kit-only:
    desc: Feature code uses UI kit components only (no raw button/input/... on web, no raw Material 3 / SwiftUI controls / std-widgets outside the kit). Native debt is a ratchet in scripts/ui-kit-only.baseline; exempt one line with a ui-kit-ignore comment that states the reason.
    cmds:
      - node scripts/check-ui-kit-only.mjs {{.CLI_ARGS}}

  check:i18n:
    desc: i18n key and placeholder parity across web, android, apple and desktop (en, ru, tg, uz, ar). Pass --cross for the cross-platform report.
    cmds:
      - node scripts/check-i18n-parity.mjs {{.CLI_ARGS}}
      - node packages/i18n/build.mjs --check

  check:boundaries:
    desc: Feature module boundary checks for all platforms (web, android, apple, desktop scripts + server architecturetest).
    cmds:
      - bash scripts/check-boundaries.sh {{.CLI_ARGS}}

  check:agpl:
    desc: ZITADEL (AGPL-3.0) stays unmodified and separate - official pinned images only, no FROM/COPY/clone/patch/Go-module link; includes a negative self-test (docs/content/server/licensing-agpl.md).
    cmds:
      - node scripts/check-zitadel-agpl.mjs

  check:docs:
    desc: Markdown links resolve, repo paths in scripts/workflows/prompts exist, no Cyrillic outside docs/archive and locales. Exceptions in scripts/check-docs.allowlist.
    cmds:
      - node --test scripts/check-docs.test.mjs
      - node scripts/check-docs.mjs

  check:features:
    desc: features.yaml parity matrix (feature x platform x status) and the per-feature shape (layers, locales, tests, navigation, ids, flagged, outbox) match the tree. Pass --require-complete for the release gate (no `missing`).
    cmds:
      - node --test scripts/test/check-features-shape.test.mjs
      - node --test scripts/test/check-backlog.test.mjs
      - node scripts/check-features.mjs {{.CLI_ARGS}}

  check:ui-kit:
    desc: ui-kit.yaml (component x platform x status, canonical variants and sizes) matches the kit trees on all four platforms, with variants and sizes checked against the web cva definitions and the Kotlin, Swift and Slint enums; prints the parity report. Pass --write-docs to regenerate the matrix in docs/content/ui-kit.md. Also fails when the component reference (docs/content/ui-kit/components) is stale; regenerate it with `task docs:ui-kit`.
    cmds:
      - node --test scripts/test/check-ui-kit.test.mjs scripts/test/component-docs.test.mjs scripts/test/component-page.test.mjs
      - node scripts/check-ui-kit.mjs {{.CLI_ARGS}}
      - node scripts/ui-kit/component-docs.mjs --check

  check:behavior:
    desc: Shared behaviour fixtures (docs/contract/behavior) agree with the reference model.
    cmds:
      - node scripts/check-behavior-fixtures.mjs

  check:analytics:
    desc: Analytics event names emitted by web, Android, Apple and Desktop match docs/contract/analytics-events.json.
    cmds:
      - node scripts/check-analytics-events.mjs

  check:dangerous:
    desc: Dangerous-code gate (eval, raw HTML sinks, shell strings, SQL built by hand, disabled TLS checks, weak crypto, hard-coded secrets) plus its negative self-test. Rules and waivers - docs/content/engineering/ai-safe-code.md.
    cmds:
      - node --test scripts/test/check-dangerous-code.test.mjs
      - node scripts/check-dangerous-code.mjs {{.CLI_ARGS}}

  new:module:
    desc: "Scaffold a feature module on every platform and register it: task new:module -- NAME=<id> [--platforms=server,web] [--dry-run] [--remove]. See docs/agent/new-module.md."
    cmds:
      - node scripts/new-module.mjs {{.CLI_ARGS}}

  new:feature:
    desc: "Scaffold a feature inside an existing module: task new:feature -- MODULE=<m> NAME=<f> [--platforms=server,web] [--project=app|admin] [--dry-run] [--remove]. Default platform: server. See docs/agent/new-module.md."
    cmds:
      - node scripts/new-feature.mjs {{.CLI_ARGS}}

  template:new:
    desc: "Turn this template into a product: task template:new -- --name <brand> --profile core|mobile|full (--out <dir> | --in-place) [--dry-run]. See README, 'Using this repo as a template'."
    cmds:
      - node scripts/template-new.mjs {{.CLI_ARGS}}

  check:hooks:
    desc: Smoke-test the Claude Code hooks (.claude/hooks, apps/server/.claude/hooks) and settings.json files by piping sample JSON into them.
    cmds:
      - bash scripts/check-hooks.sh

  test:scripts:
    desc: Tests of the repo scripts (template-new per profile on repo copies, new-module, new-feature, docs, features shape, backlog). Slow; CI runs them in policies-ci.
    cmds:
      - node --test scripts/test/template-new.test.mjs scripts/new-module.test.mjs scripts/test/new-feature.test.mjs scripts/check-docs.test.mjs scripts/test/check-features-shape.test.mjs scripts/test/check-backlog.test.mjs

  doctor:
    desc: "Print the active profile (PROFILE, default core) and detect installed toolchains: which verification level (static / tests / build) is possible per platform."
    cmds:
      - bash scripts/doctor.sh

  # --- verify:<platform>: print the exact commands that verify a platform --------
  # These only print; run them yourself (or use the platform tasks). See docs/content/status.md.
  verify:server:
    desc: Print the commands that verify the server.
    silent: true
    cmds:
      - |
        echo "task server:check                              # gen:check, lint (incl. tidy:check), arch, vuln, unit tests: the fast gate CI runs"
        echo "task server:build server:test:race             # build and race-detector unit tests (race needs cgo)"
        echo "task server:test:integration                 # needs Docker, or AEDST_TEST_DATABASE_URL pointing at a Postgres"
  verify:web:
    desc: Print the commands that verify the web workspace (app, admin, marketing).
    silent: true
    cmds:
      - |
        echo "pnpm --dir apps/web install --frozen-lockfile      # ONE install for the whole workspace"
        echo "task web:lint web:knip web:test:coverage web:build web:check:bundle   # all three projects"
        echo "task app:lint app:test | admin:lint admin:test | marketing:lint marketing:test   # one project"
        echo "task app:test:e2e           # Playwright, needs browsers"
  verify:android:
    desc: Print the commands that verify Android (needs JDK 21 and the Android SDK).
    silent: true
    cmds:
      - |
        echo "task android:generate android:lint android:test android:build"
        echo "task android:androidtest    # emulator/device"
  verify:apple:
    desc: Print the commands that verify Apple (macOS, Xcode 26.6).
    silent: true
    cmds:
      - |
        echo "task apple:generate apple:lint apple:test apple:build   # macOS only; Tuist install/generate and xcodebuild"
        echo "then launch the app in a simulator"
  verify:gateway:
    desc: Print the commands that verify the Rust realtime gateway (cargo; the end-to-end test also needs Docker).
    silent: true
    cmds:
      - |
        echo "rustup toolchain install <version in apps/gateway/rust-toolchain.toml>"
        echo "task gateway:lint gateway:test gateway:build gateway:deny   # rustfmt, clippy -D warnings, cargo test, cargo build, cargo-deny"
        echo "bash scripts/rust/check-approved-crates.sh          # no cargo: approved direct dependencies, versions shared with desktop"
        echo "End to end (Docker for Postgres): AEDST_GATEWAY_BIN=apps/gateway/target/debug/aedst-gateway go test -tags integration ./internal/platform/natsbridge/   (in apps/server)"
  verify:desktop:
    desc: Print the commands that verify the Rust + Slint Desktop app (cargo, Windows or Linux).
    silent: true
    cmds:
      - |
        echo "rustup toolchain install <version in apps/desktop/rust-toolchain.toml>"
        echo "task desktop:lint desktop:test desktop:build   # rustfmt, clippy -D warnings, cargo test, cargo build"
        echo "task desktop:deny                                    # needs: cargo install --locked cargo-deny@0.20.2"
        echo "bash apps/desktop/scripts/check-feature-boundaries.sh   # no cargo: crate boundaries, feature layout, approved crates, self-tests"
        echo "Linux needs Slint system libraries (fontconfig, xkbcommon, wayland): UNVERIFIED list, see desktop-ci.yml"
  deps:update:
    desc: Update every platform to the latest stable dependencies (pass platforms as CLI_ARGS, e.g. `task deps:update -- server web`).
    cmds:
      - bash scripts/update-deps.sh {{.CLI_ARGS}}

  deps:check:
    desc: Report outdated dependencies on every platform without changing anything.
    cmds:
      - bash scripts/update-deps.sh --check {{.CLI_ARGS}}

  dev:
    desc: Start local infra + the server (run web:dev in another shell).
    cmds:
      - task: server:dev

  # --- infrastructure as code (OpenTofu; infra/ does not exist yet) -------
  # Single IaC tool: OpenTofu (decisions.md). These no-op until infra/ exists.
  infra:fmt:
    desc: tofu fmt -check -recursive on infra/ (no-op while infra/ is absent).
    cmds:
      - |
        if [ ! -d infra ]; then echo "infra/ absent: nothing to format"; exit 0; fi
        command -v tofu >/dev/null 2>&1 || { echo "tofu not installed (mise install)" >&2; exit 1; }
        tofu fmt -check -recursive infra

  infra:validate:
    desc: tofu init -backend=false + validate for every infra/ root module (no-op while infra/ is absent).
    cmds:
      - |
        if [ ! -d infra ]; then echo "infra/ absent: nothing to validate"; exit 0; fi
        command -v tofu >/dev/null 2>&1 || { echo "tofu not installed (mise install)" >&2; exit 1; }
        for d in $(find infra -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
          (cd "$d" && tofu init -backend=false -input=false >/dev/null && tofu validate) || exit 1
        done

  # --- design tokens (packages/design-tokens, may not exist yet) ---------
  tokens:build:
    desc: Regenerate the design-token outputs for every platform (never hand-edit generated files).
    status:
      - test ! -d packages/design-tokens
    cmds:
      - pnpm --dir packages/design-tokens install --frozen-lockfile
      - pnpm --dir packages/design-tokens build

  tokens:check:
    desc: Fail if generated design-token outputs drift from their source.
    status:
      - test ! -d packages/design-tokens
    cmds:
      - pnpm --dir packages/design-tokens install --frozen-lockfile
      - pnpm --dir packages/design-tokens check

  # --- docs site (docs/, Fumadocs) ---------------------------------------------
  docs:dev:
    desc: Start the docs site dev server.
    cmds:
      - pnpm --dir docs dev
  docs:api:
    desc: Regenerate docs/content/modules/<module>/api.md (API reference with requests and responses) from buf's descriptor of apps/server/api/proto (needs buf).
    cmds:
      - node scripts/api-docs/index.mjs
  docs:ui-kit:
    desc: Regenerate the component reference, docs/content/ui-kit/components/<name>.mdx (one page per ui-kit.yaml entry, with the public API and a usage example per platform, read from the kit sources), and the matrix in docs/content/ui-kit.md.
    cmds:
      - node scripts/check-ui-kit.mjs --write-docs
      - node scripts/ui-kit/component-docs.mjs
  check:api-docs:
    desc: The committed API reference pages match the .proto files (regenerate with `task docs:api`; needs buf), plus the generator's own tests.
    cmds:
      - node --test scripts/api-docs/descriptor.test.mjs
      - node scripts/api-docs/index.mjs --check
      - node docs/scripts/openapi-pages.mjs --check
  docs:test:
    desc: Unit tests for the docs site generators (llms.txt, llms-full.txt, front matter).
    cmds:
      - pnpm --dir docs test
  docs:build:
    desc: Build the docs site (Fumadocs, built-in search).
    cmds:
      - pnpm --dir docs build

  # --- web (workspace apps/web: shared + app + admin + marketing) ------------
  # web:* runs every project; app:* / admin:* / marketing:* run one project.
  # The ONE install is: pnpm --dir apps/web install --frozen-lockfile
  web:generate:
    desc: Regenerate the shared Connect clients from the protos.
    cmds:
      - task: app:generate
  web:lint:
    desc: Biome lint and typecheck of app, admin and marketing.
    cmds:
      - task: app:lint
      - task: admin:lint
      - task: marketing:lint
  web:knip:
    desc: knip of app, admin and marketing.
    cmds:
      - task: app:knip
      - task: admin:knip
      - task: marketing:knip
  web:test:
    desc: Unit tests of app, admin and marketing (shared tests are hosted by app).
    cmds:
      - task: app:test
      - task: admin:test
      - task: marketing:test
  web:test:coverage:
    desc: Coverage-gated tests (app; admin and marketing have no thresholds yet).
    cmds:
      - task: app:test:coverage
  web:test:e2e:
    desc: Playwright suites of app, admin and marketing (run web:build first).
    cmds:
      - task: app:test:e2e
      - task: admin:test:e2e
      - task: marketing:test:e2e
  web:check:bundle:
    desc: Client bundle size budgets of app, admin and marketing (run after web:build).
    cmds:
      - task: app:check:bundle
      - task: admin:check:bundle
      - task: marketing:check:bundle
  web:check:source:
    desc: Source bans in app, admin, marketing and shared (physical Tailwind direction utilities, Base64 images).
    dir: apps/web
    cmds:
      - pnpm --dir app check:source
      - pnpm --dir admin check:source
      - pnpm --dir marketing check:source
  web:lighthouse:
    desc: Lighthouse CI budgets of app and marketing (run after web:build; needs Chrome).
    cmds:
      - task: app:lighthouse
      - task: marketing:lighthouse
  web:build:
    desc: Production build of app, admin and marketing.
    cmds:
      - task: app:build
      - task: admin:build
      - task: marketing:build
  web:dev:
    desc: Start all three dev servers (app 3000, admin 3001, marketing 3002).
    dir: apps/web
    cmds: ["pnpm -r --parallel dev"]

  # --- web: app (product, signed-in users, port 3000) ----------------------
  app:generate:
    desc: Regenerate the shared Connect clients from the protos (pnpm connect:generate, hosted by app).
    dir: apps/web/app
    cmds: [pnpm connect:generate]
  app:test:coverage:
    desc: App unit/integration tests with the coverage thresholds CI enforces.
    dir: apps/web/app
    cmds: [pnpm test:coverage]
  app:test:e2e:
    desc: App Playwright suite (all browsers + phones) against the mock API.
    dir: apps/web/app
    cmds: [pnpm test:e2e:prod]
  app:check:bundle:
    desc: App client bundle size budget (run after app:build).
    dir: apps/web/app
    cmds: [pnpm check:bundle]
  app:lighthouse:
    desc: App Lighthouse CI budgets (run after app:build; needs Chrome).
    dir: apps/web/app
    cmds: [pnpm lighthouse]
  app:dev:
    desc: Start the app dev server.
    dir: apps/web/app
    cmds: [pnpm dev]
  app:build:
    desc: Production build of the app (Next.js).
    dir: apps/web/app
    cmds: [pnpm build]
  app:lint:
    desc: app Biome lint and TypeScript typecheck.
    dir: apps/web/app
    cmds: ["pnpm lint", "pnpm typecheck"]
  app:knip:
    desc: app unused files/exports/dependencies and the approved-library allowlist (knip).
    dir: apps/web/app
    cmds: [pnpm knip]
  app:test:
    desc: app unit tests (Vitest).
    dir: apps/web/app
    cmds: [pnpm test]

  # --- web: admin (staff panel, port 3001) ---------------------------------
  admin:dev:
    desc: Start the admin dev servers (Vite on 3001, Hono BFF on 3101; Vite proxies /api to the BFF).
    dir: apps/web/admin
    cmds: [pnpm dev]
  admin:build:
    desc: Production build of the admin (vite build to dist/, BFF bundle to dist-server/main.mjs).
    dir: apps/web/admin
    cmds: [pnpm build:all]
  admin:start:
    desc: Run the built admin (node dist-server/main.mjs; run admin:build first, see server/.env.example).
    dir: apps/web/admin
    cmds: [pnpm start]
  admin:lint:
    desc: admin Biome lint and TypeScript typecheck.
    dir: apps/web/admin
    cmds: ["pnpm lint", "pnpm typecheck"]
  admin:knip:
    desc: admin unused files/exports/dependencies and the approved-library allowlist (knip).
    dir: apps/web/admin
    cmds: [pnpm knip]
  admin:test:
    desc: admin tests (Vitest unit + browser projects, then the BFF server tests).
    dir: apps/web/admin
    cmds: [pnpm test]
  admin:test:e2e:
    desc: admin Playwright e2e (flows and axe WCAG 2.2 AA) against the built BFF and the mock IdP/API (run admin:build first; pnpm test:browser:install once).
    dir: apps/web/admin
    cmds: [pnpm test:e2e]
  admin:check:bundle:
    desc: admin client bundle and font budget (run after admin:build).
    dir: apps/web/admin
    cmds: [pnpm check:bundle]

  # --- web: marketing (site, port 3002) ----------------------------
  marketing:dev:
    desc: Start the marketing dev server.
    dir: apps/web/marketing
    cmds: [pnpm dev]
  marketing:build:
    desc: Production build of the marketing (Next.js).
    dir: apps/web/marketing
    cmds: [pnpm build]
  marketing:check:bundle:
    desc: marketing client bundle and font budget (run after marketing:build).
    dir: apps/web/marketing
    cmds: [pnpm check:bundle]
  marketing:lighthouse:
    desc: marketing Lighthouse CI budgets (run after marketing:build; needs Chrome).
    dir: apps/web/marketing
    cmds: [pnpm lighthouse]
  marketing:test:e2e:
    desc: marketing Playwright e2e on the built site (rendered SEO tags of every page and locale, axe WCAG 2.2 AA; pnpm test:e2e:install once).
    dir: apps/web/marketing
    cmds: [pnpm test:e2e]
  marketing:lint:
    desc: marketing Biome lint and TypeScript typecheck.
    dir: apps/web/marketing
    cmds: ["pnpm lint", "pnpm typecheck"]
  marketing:knip:
    desc: marketing unused files/exports/dependencies and the approved-library allowlist (knip).
    dir: apps/web/marketing
    cmds: [pnpm knip]
  marketing:test:
    desc: marketing unit tests (Vitest).
    dir: apps/web/marketing
    cmds: [pnpm test]

  # --- android -------------------------------------------------------------
  android:generate:
    desc: Generate Android Connect/protobuf code (buf, via make generate).
    dir: apps/android
    cmds: [make generate]
  android:lint:
    desc: Android ktlint, detekt and Android Lint (needs JDK 21 and the Android SDK).
    dir: apps/android
    cmds: ["./gradlew ktlintCheck detekt lintDebug"]
  android:test:
    desc: Android JVM unit tests (testDebugUnitTest).
    dir: apps/android
    cmds: ["./gradlew testDebugUnitTest"]
  android:build:
    desc: Assemble the Android debug APKs (needs JDK 21 and the Android SDK).
    dir: apps/android
    cmds: ["./gradlew assembleDebug"]
  android:androidtest:
    desc: Compose UI tests with Accessibility Test Framework checks (needs an emulator/device).
    dir: apps/android
    cmds: ["./gradlew connectedDebugAndroidTest"]
  android:release:
    desc: R8 release build; pass pins as ARGS="-Paedst.certPins=sha256/<live>,sha256/<backup>" (refuses to build unpinned).
    dir: apps/android
    cmds: ["./gradlew :app:assembleRelease {{.CLI_ARGS}}"]

  # --- apple (macOS only) --------------------------------------------------
  apple:generate:
    desc: Apple Connect/protobuf codegen (macOS only).
    platforms: [darwin]
    dir: apps/apple
    cmds: [make generate]
  apple:lint:
    desc: Apple SwiftLint and swift-format lint (macOS only).
    platforms: [darwin]
    dir: apps/apple
    cmds: [make lint]
  apple:test:
    desc: Apple package unit tests (macOS only; never run in the authoring environment).
    platforms: [darwin]
    dir: apps/apple
    cmds: [make test]
  apple:project:
    desc: Generate the Xcode project/workspace with Tuist (macOS only).
    platforms: [darwin]
    dir: apps/apple
    cmds: [make project]
  apple:build:
    desc: Build both Apple app schemes through Tuist (macOS only, needs Xcode; never compiled in the authoring environment).
    platforms: [darwin]
    dir: apps/apple
    cmds: [make tuist-build]
  apple:release-ios:
    desc: fastlane (match + gym + deliver) iOS release; needs `bundle install`, APPLE_TEAM_ID, ASC_*, MATCH_*; see docs/content/apple/release.md.
    platforms: [darwin]
    dir: apps/apple
    cmds: [make release-ios]
  apple:release-macos:
    desc: fastlane macOS Developer ID build, notarized and stapled (DISTRIBUTION=app-store for the Mac App Store).
    platforms: [darwin]
    dir: apps/apple
    cmds: [make release-macos]
  apple:signing-sync:
    desc: ADMIN, local - create/refresh all match certificates and profiles (fastlane match_sync).
    platforms: [darwin]
    dir: apps/apple
    cmds: [make signing-sync]
  apple:format:
    desc: swift-format in place (Generated/.build excluded).
    platforms: [darwin]
    dir: apps/apple
    cmds: [make format]

  # --- gateway (Rust realtime WebSocket gateway, ADR-0021; needs cargo) ---
  gateway:fmt:
    desc: Format the gateway with rustfmt.
    dir: apps/gateway
    cmds:
      - cargo fmt
  gateway:lint:
    desc: rustfmt --check and clippy -D warnings over the gateway; prints SKIPPED without cargo.
    dir: apps/gateway
    cmds:
      - |
        command -v cargo >/dev/null 2>&1 || { echo "SKIPPED: cargo not installed (gateway:lint)"; exit 0; }
        cargo fmt --check
        cargo clippy --all-targets -- -D warnings
  gateway:test:
    desc: Unit and contract tests of the gateway; prints SKIPPED without cargo.
    dir: apps/gateway
    cmds:
      - |
        command -v cargo >/dev/null 2>&1 || { echo "SKIPPED: cargo not installed (gateway:test)"; exit 0; }
        cargo test
  gateway:build:
    desc: Build the gateway (debug, or RELEASE=1); prints SKIPPED without cargo.
    dir: apps/gateway
    cmds:
      - |
        command -v cargo >/dev/null 2>&1 || { echo "SKIPPED: cargo not installed (gateway:build)"; exit 0; }
        cargo build {{if .RELEASE}}--release{{end}}
  gateway:deny:
    desc: cargo-deny (licenses, advisories, bans, sources) for the gateway; prints SKIPPED when cargo-deny is missing.
    dir: apps/gateway
    cmds:
      - |
        command -v cargo-deny >/dev/null 2>&1 || { echo "SKIPPED: cargo-deny not installed (cargo install --locked cargo-deny@0.20.2)"; exit 0; }
        cargo deny check

  # --- desktop (Rust + Slint, ADR apps/desktop/docs/adr/0001; needs cargo) ---
  desktop:fmt:
    desc: Format the Rust workspace with rustfmt.
    dir: apps/desktop
    cmds:
      - cargo fmt
  desktop:lint:
    desc: rustfmt --check and clippy -D warnings over the Rust desktop workspace; prints SKIPPED without cargo.
