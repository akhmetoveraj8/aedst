  desktop:test:
    desc: Unit and integration tests of the Rust desktop workspace; prints SKIPPED without cargo.
    dir: apps/desktop
    cmds:
      - |
        command -v cargo >/dev/null 2>&1 || { echo "SKIPPED: cargo not installed (desktop:test)"; exit 0; }
        cargo test --workspace
  desktop:build:
    desc: Build the Rust desktop workspace (debug, or RELEASE=1); prints SKIPPED without cargo.
    dir: apps/desktop
    cmds:
      - |
        command -v cargo >/dev/null 2>&1 || { echo "SKIPPED: cargo not installed (desktop:build)"; exit 0; }
        cargo build --workspace {{if .RELEASE}}--release{{end}}
  desktop:deny:
    desc: cargo-deny (licenses, advisories, bans, sources); prints SKIPPED when cargo-deny is missing.
    dir: apps/desktop
    cmds:
      - |
        command -v cargo-deny >/dev/null 2>&1 || { echo "SKIPPED: cargo-deny not installed (cargo install --locked cargo-deny@0.20.2)"; exit 0; }
