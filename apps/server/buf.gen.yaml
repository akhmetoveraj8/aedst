version: v2
managed:
  enabled: true
  disable:
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/aedst/server/gen/go
plugins:
  # Plugins run from the module's `tool` directives (go.mod), so the generator
  # versions are pinned with the runtime and need no separate install.
  - local: [go, tool, protoc-gen-go]
    out: gen/go
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen/go
    opt: paths=source_relative
