syntax = "proto3";

package aedst.events.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/aedst/server/gen/go/aedst/events/v1;eventsv1";

// EventIngestService is the wire contract for an integration event that crosses a
// database boundary (ADR-0022). A producer whose consumer lives in another
// service does not insert the consumer's delivery in its own River tables: it
// inserts a platform.event_forward job in the same transaction as the state
// change, and that job calls Deliver on the consumer's service. The consumer's
// service inserts the real delivery job in its own database, so each side keeps
// its own outbox and retry lifecycle and no distributed transaction exists.
//
// The service is closed to users: only the machine identity (role "internal",
// see AEDST_SERVICE_IDENTITY_*) may call it, and it is mounted only when
// AEDST_EVENTS_INGEST_ENABLED is true. The event payload stays the JSON the
// producing module serialises (pinned by its golden fixtures); this envelope is
// what buf breaking guards.
service EventIngestService {
  // Deliver records one event delivery for one consumer. It is idempotent on
  // (consumer, event_id): replaying it (the producer retries after a lost
  // response) never creates a second delivery. An unknown consumer is NOT_FOUND
  // and a malformed envelope INVALID_ARGUMENT; both are permanent, the producer
  // does not retry them.
  rpc Deliver(DeliverRequest) returns (DeliverResponse);
}

message DeliverRequest {
  // Stable consumer name "<unit>.<name>", e.g. "notifications.task_completed".
  string consumer = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  // Event id (UUID), stable across redeliveries; the consumer dedupes on it.
  string event_id = 2 [(buf.validate.field).string.uuid = true];
  // Event type, e.g. "tasks.v1.TaskCompleted".
  string event_type = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  uint32 event_version = 4;
  google.protobuf.Timestamp occurred_at = 5 [(buf.validate.field).required = true];
  // Aggregate id (UUID) the event is partitioned by.
  string partition_key = 6 [(buf.validate.field).string.uuid = true];
  // W3C traceparent of the originating request; empty if none.
  string traceparent = 7 [(buf.validate.field).string.max_len = 128];
  // The event payload exactly as the producing module serialised it (JSON).
  bytes payload = 8 [(buf.validate.field).bytes.max_len = 262144];
}

message DeliverResponse {
  // True when this call created the delivery, false when it already existed.
  bool created = 1;
}
