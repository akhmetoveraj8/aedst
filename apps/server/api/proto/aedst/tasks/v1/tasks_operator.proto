syntax = "proto3";

package aedst.tasks.v1;

import "aedst/tasks/v1/tasks.proto";
import "buf/validate/validate.proto";

option go_package = "github.com/aedst/server/gen/go/aedst/tasks/v1;tasksv1";

// TasksOperatorService is the cross-owner (operator) surface of tasks. The admin
// module calls it when tasks is not hosted in its own process; in a monolith the
// same operations run in-process through tasks/api.AdminService and this service
// is mounted but unused. It is closed to ordinary users: the module's built-in
// role policy admits only "admin" (a human operator whose token the admin module
// forwards, for reads), "support"/"auditor" (reads they already have in admin)
// and "internal" (the machine identity of the admin.apply job, for mutations).
// Mutations are idempotent on idempotency_key.
service TasksOperatorService {
  // Lists tasks across owners, newest first (keyset).
  rpc ListAllTasks(ListAllTasksRequest) returns (ListAllTasksResponse);
  // Counts over every owner's tasks (capped, see the fields).
  rpc GetAllTaskStats(GetAllTaskStatsRequest) returns (GetAllTaskStatsResponse);
  // Deletes any user's task and publishes TaskDeleted in the same transaction.
  // Replaying an idempotency_key returns the first result; reusing a key for a
  // different task_id is ABORTED. An unknown task is NOT_FOUND.
  rpc OperatorDeleteTask(OperatorDeleteTaskRequest) returns (OperatorDeleteTaskResponse);
}

message ListAllTasksRequest {
  // Empty means every owner.
  string owner_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Case-insensitive substring of the title.
  string query = 2 [(buf.validate.field).string.max_len = 200];
  // 0 selects the server default.
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  // Opaque token from a previous response, bound to this ordering.
  string page_token = 4 [(buf.validate.field).string.max_len = 512];
}

message ListAllTasksResponse {
  // created_by of each task is its owner.
  repeated Task tasks = 1;
  // Empty means there is no next page.
  string next_page_token = 2;
}

message GetAllTaskStatsRequest {}

message GetAllTaskStatsResponse {
  // Counted over at most 1,000,000 tasks (lower bounds beyond that).
  int64 total = 1;
  int64 done = 2;
  // status != DONE and due_date is in the past.
  int64 overdue = 3;
}

message OperatorDeleteTaskRequest {
  string task_id = 1 [(buf.validate.field).string.uuid = true];
  // Makes the call safe to retry: 1-128 characters, unique per intended deletion
  // (the admin module sends the audit entry id).
  string idempotency_key = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message OperatorDeleteTaskResponse {
  // The deleted task's owner.
  string owner_id = 1;
}
