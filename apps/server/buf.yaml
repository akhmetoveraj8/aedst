version: v2
modules:
  - path: api/proto
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # ADR-0019: first-party authentication was removed outright. AuthService is
  # gone and AdminService lost ListUsers and users_total (reserved). Clients
  # authenticate against the OIDC provider only. Remove these exemptions once
  # the comparison branch contains this change.
  ignore:
    - api/proto/aedst/auth/v1/auth.proto
  ignore_only:
    RPC_NO_DELETE:
      - api/proto/aedst/admin/v1/admin.proto
    MESSAGE_NO_DELETE:
      - api/proto/aedst/admin/v1/admin.proto
    FIELD_NO_DELETE:
      - api/proto/aedst/admin/v1/admin.proto
