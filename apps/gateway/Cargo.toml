[package]
name = "aedst-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
description = "AEDST realtime gateway: NATS JetStream events to authenticated WebSocket clients (ADR-0021, ADR-0026)."
build = "build.rs"

# Versions verified against crates.io on 2026-11-18. Every version and every feature name below was checked
# against the crates.io API (`/api/v1/crates/<name>/<version>`, the `features` map) on 2026-11-21: all exist.
# Compiled together on 2026-11-28 (Windows, Rust 1.99.1): build, clippy -D warnings, tests and cargo-deny pass. A crate must also be in approved-crates.txt and on
# docs/content/library-first/gateway.md; versions shared with apps/desktop/Cargo.toml must be identical
# (scripts/rust/check-approved-crates.sh, no cargo needed).
[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = "0.7.20"
futures = "0.3.34"
axum = { version = "0.8.9", default-features = false, features = ["ws", "http1", "tokio"] }
# The accept loop (src/server.rs): header-read timeout and a cap on connections in the HTTP phase, which
# `axum::serve` does not offer. Same crate and features axum 0.8.9 itself depends on (^0.1.3).
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server", "http1", "service"] }
async-nats = "0.53.0"
# Contract with the Go server, generated at build time from apps/server/api/proto by build.rs (ADR-0026):
# the NATS envelope (messages, buffa) and the RealtimeService client (connectrpc). Pre-1.0, so pinned
# exactly like apps/desktop (the script fails on a version that differs from the desktop's). Plain HTTP only
# (`client`, no `client-tls`): the API is reached inside the cluster; TLS there is the service mesh's job.
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client"] }
buffa = "0.9.2"
buffa-types = { version = "0.9.2", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
# `raw_value`: the client frame embeds the producer's JSON payload unchanged.
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Telemetry: traces and metrics over OTLP/HTTP when OTEL_EXPORTER_OTLP_ENDPOINT is set. Feature names exist
# (checked); `http-proto` enables the `metrics` signal of opentelemetry-otlp.
# UNVERIFIED at run time: `reqwest-client` (async) together with the SDK's thread-based batch processor and
# periodic reader used in src/telemetry.rs; if the exporter cannot reach a Tokio reactor, switch to `reqwest-blocking-client`.
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.34.0"

[build-dependencies]
# Runs `buf build` in apps/server and generates Rust from the descriptor set (same pin as apps/desktop).
connectrpc-build = "=0.9.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
