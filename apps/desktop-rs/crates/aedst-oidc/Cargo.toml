[package]
name = "aedst-oidc"
version = "0.0.0"
description = "OIDC sign-in for the desktop app: Authorization Code + PKCE, loopback redirect, refresh token in the OS keychain (keyring-core + a chosen store)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openidconnect = { workspace = true }
keyring-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
webbrowser = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { workspace = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
chrono = { workspace = true }
rsa = { workspace = true }
rand_core = { workspace = true }

[lints]
workspace = true
