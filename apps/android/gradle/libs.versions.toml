# Kotlin Multiplatform structure (android + jvm targets, no iOS): docs/content/android/kmp.md. AGP 9 does not allow
# `com.android.library` next to `kotlin-multiplatform`; `com.android.kotlin.multiplatform.library` is its replacement.
