# nginx for apps/web/marketing (the static export in out/). Replaces
# /etc/nginx/nginx.conf of nginxinc/nginx-unprivileged (non-root, port 8080).
#
# The per-page CSP and the common headers are GENERATED by
# scripts/build-security-headers.mjs into /etc/nginx/aedst/ (see the Dockerfile);
# this file only routes. nginx drops every inherited add_header as soon as a
# block declares one of its own, so every block that adds a header includes
# nginx-common.conf again.
#
# NOT verified with `nginx -t` or a running container (no Docker or nginx in
# the authoring environment): the first image build is its acceptance test.
# scripts/serve-out.mjs implements the same routing for the Playwright suite.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  keepalive_timeout 15s;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css text/xml application/json application/javascript
    application/xml application/manifest+json image/svg+xml;

  # First language of Accept-Language wins (browsers list by preference).
  # `tg` is the BCP 47 tag of Tajik; the URL locale is `tj`.
  map $http_accept_language $aedst_locale {
    default en;
    ~^\s*ru ru;
    ~^\s*tg tj;
    ~^\s*uz uz;
    ~^\s*ar ar;
  }

  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Next emits `/en`, never `/en/`.
    rewrite ^/(.+)/$ /$1 permanent;

    # The locale-less root: negotiated redirect. `index.html` (a meta refresh)
    # remains for crawlers and hosts that cannot negotiate.
    location = / {
      include /etc/nginx/aedst/nginx-common.conf;
      add_header Vary "Accept-Language" always;
      return 302 /$aedst_locale;
    }

    # Every exported page: its own CSP with the hashes of its inline scripts.
    include /etc/nginx/aedst/nginx-pages.conf;

    # Hashed build assets never change.
    location /_next/static/ {
      include /etc/nginx/aedst/nginx-common.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Generated files that are not part of the site.
    location ~ ^/(_headers|404\.html)$ {
      return 404;
    }

    # A path under a locale that is not a page: 404 in that language.
    location ~ ^/(?<aedst_loc>en|ru|tj|uz|ar)(/|$) {
      error_page 404 /$aedst_loc/404;
      include /etc/nginx/aedst/nginx-common.conf;
      add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
      try_files $uri $uri.html =404;
    }

    # Metadata files, RSC payloads, icons, fonts. Not documents: nothing may run.
    location / {
      error_page 404 /en/404;
      include /etc/nginx/aedst/nginx-common.conf;
      add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
      add_header Cache-Control "public, s-maxage=3600, stale-while-revalidate=86400" always;
      try_files $uri =404;
    }
  }
}
