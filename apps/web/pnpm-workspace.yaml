onlyBuiltDependencies:
  - "@bufbuild/buf"
  - "@parcel/watcher"
  - "@swc/core"
# A version must be at least one day old before pnpm resolves it. Add an
# exact name@version to minimumReleaseAgeExclude only for a release younger
# than the window that must be used now, and drop it once it ages out.
# Security fast path: a fix for a published advisory (CVE/GHSA or the vendor's
# security bulletin) may be excluded at once; list every package the release
# pulls in at that exact version (e.g. next and each @next/swc-*), add a
# comment with the advisory URL, and remove the lines once they age out.
# Never downgrade a version to make an install pass inside the window.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@connectrpc/connect-web@2.3.0"
  - "@connectrpc/connect@2.3.0"
  - "@hookform/resolvers@6.0.1"
  - "@posthog/core@1.61.1"
  - "@posthog/types@1.417.0"
  - "@shadcn/registry@0.2.1"
  - "@storybook/addon-a11y@10.6.7"
  - "@storybook/addon-vitest@10.6.7"
  - "@storybook/builder-vite@10.6.7"
  - "@storybook/nextjs-vite@10.6.7"
  - "@storybook/react-dom-shim@10.6.7"
  - "@storybook/react-vite@10.6.7"
  - "@storybook/react@10.6.7"
  - "shadcn@4.23.0"
  - "storybook@10.6.7"
  - "vite-plugin-storybook-nextjs@10.6.7"
allowBuilds:
  "@bufbuild/buf": true
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  core-js: false
