[package]
name = "aedst-release"
version = "0.0.0"
description = "Release tool: key generation, manifest building from a Velopack feed entry, signing and verification with the app's own verifier"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "aedst_release"
path = "src/lib.rs"

[[bin]]
name = "aedst-release"
path = "src/main.rs"

[dependencies]
aedst-update = { path = "../aedst-update" }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }

[lints]
workspace = true
