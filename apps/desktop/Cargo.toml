[workspace]
resolver = "3"
members = ["crates/*"]
# Superseded by the aedst-ui gallery; its files are still on disk until the lead deletes them.
exclude = ["crates/aedst-spike"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

# Versions verified against crates.io on 2026-11-01. A crate may be used only after it is
# listed here AND on docs/content/library-first/desktop.md (cargo-deny enforces the list).
[workspace.dependencies]
slint = "1.19.0"
slint-build = "1.19.0"
# Internal Slint crate (no semver): MUST be pinned with `=` and must equal the slint version. Test-only.
i-slint-backend-testing = "=1.19.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-util = "0.7.20"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
# zstd is off: its crates carry RUSTSEC-2026-0391/0398/0403 (cargo deny), gzip is enough for the server.
# Pre-1.0: pinned exactly (connectrpc, connectrpc-build and buffa move together).
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "client-tls"] }
connectrpc-build = "=0.9.0"
buffa = "0.9.2"
buffa-types = { version = "0.9.2", features = ["json"] }
openidconnect = { version = "4.1.0", features = ["timing-resistant-secret-traits"] }
webbrowser = "1.2.6"
subtle = "2.6.1"
semver = "1.0.28"
dirs = "7.0.0"
sys-locale = "0.3.2"
# TLS for the API client: the OS trust store (rustls-native-certs) with the `ring` provider (aws-lc-rs is also
# in the tree through other crates, so the provider is passed explicitly and no process default is needed).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
uuid = { version = "1.29.0", features = ["v4"] }
# Credential stores are chosen explicitly (the keyring crate docs advise applications to use keyring-core plus
# stores instead of the `keyring` meta crate). Mock store: keyring_core::mock (always available).
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
velopack = "1.2.161"
ed25519-dalek = "3.0.0"
aes-gcm = "0.11.1"
sha2 = "0.11.1"
rand = "0.10.3"
zeroize = "1.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
# No default features: `minidump`, `logs`, `metrics`, release-health and native-tls stay off (see aedst-telemetry).
sentry = { version = "0.49.5", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls"] }
image = "0.25.10"
notify-rust = "4.18.2"
proptest = "1.12.0"
insta = "1.49.0"
mockall = "0.15.0"
wiremock = "0.6.5"
# Test-only, for the fake identity provider: rsa 0.9 (the version openidconnect uses) needs rand_core 0.6.
chrono = "0.4.45"
rsa = { version = "0.9.10", features = ["pem"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }

[workspace.lints.rust]
# "forbid" cannot be used: Slint-generated code carries #[allow(unsafe_code)] and forbid overrules it (spike, 2026-11-01).
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "deny"
print_stderr = "deny"

# RSA key generation in tests is unusably slow unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# Debug builds of this workspace (Slint, connectrpc, SQLite) reached 46 GB with incremental builds and full
# debug info. Line tables are enough for backtraces; incremental is off to keep `target` small.
[profile.dev]
debug = "line-tables-only"
incremental = false
