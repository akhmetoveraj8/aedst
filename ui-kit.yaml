# Machine-readable UI kit manifest: component x platform x status, with the canonical variants and sizes.
# Checked by `task check:ui-kit` (scripts/check-ui-kit.mjs) in CI. Docs: docs/content/ui-kit.md (the matrix
# there is generated from this file: `node scripts/check-ui-kit.mjs --write-docs`).
#
# The kit is the shadcn/ui component set (59 names) plus two AEDST components, `trace` and `code-block`:
# 61 entries. Names follow shadcn on every platform; `variants` and `sizes` are canonical for every platform
# and are taken from the web implementation, the reference (checked against its `cva` definitions, both ways).
# The native kits are checked the same way against the enums of the component file (Kotlin enum constants,
# Swift enum cases, Slint enums): an enum whose name ends with the axis name (`...Variant`, `...Size`,
# `...Orientation`) supplies that axis; names compare case-insensitively with separators ignored
# (`icon-sm` == `ICON_SM` == `iconSm`). A new component lands here first.
#
# Status vocabulary:
#   implemented  the component file exists (`file`, relative to the platform `root`; a directory on web)
#   missing      not implemented on that platform; fails the check on every platform (the kit is complete)
#   native       the platform SDK provides it and the kit adds nothing; must carry `note:`
# `alias: <name>` means the entry is served by another entry on every platform and counts with it.
# `axes` lists further `cva` axes of the web component (checked like variants when declared).
# `deviations: { <platform>: { <axis>: { values: [...], reason: "..." } } }` records a native platform whose
# enum for an axis differs from the canonical list on purpose: `values` is that platform's own list (checked
# against its file), `reason` is mandatory. Without it a difference fails the check. Not allowed on web.
# "implemented" is about the file tree only; it does not claim the platform compiles (docs/content/status.md).
version: 1

platforms:
  web:     { root: apps/web/shared/ui, reference: true }
  android: { root: apps/android/core/ui/src/main/kotlin/com/aedst/core/ui/components }
  apple:   { root: apps/apple/Core/AedstDesignSystem/Sources/AedstDesignSystem/Components }
  desktop: { root: apps/desktop/crates/aedst-ui/ui }

# Which entries of a platform root are kit components. Everything that matches must be listed under
# `components` or `extensions` (no undeclared kit files). Web also counts directories (sidebar/) and
# requires a story next to every component. Desktop: the gallery (gallery.slint, ui/gallery/) is not a component.
kit_files:
  web:     { ext: .tsx, exclude_suffix: [.stories.tsx, .test.tsx], directories: true, require_story: true }
  android: { ext: .kt }
  apple:   { ext: .swift }
  desktop: { ext: .slint, not_components: [aedst_layout.slint, aedst_tokens.slint, gallery.slint, lib.slint] }

components:
  accordion:
    variants: []
    sizes: []
    web:     { status: implemented, file: accordion.tsx }
    android: { status: implemented, file: AedstAccordion.kt }
    apple:   { status: implemented, file: AedstAccordion.swift }
    desktop: { status: implemented, file: aedst_accordion.slint }
  alert:
    variants: [default, destructive]
    sizes: []
    # Android adds the enum AedstAlertAccent (none, warning), a documented extension outside the canonical axes.
    web:     { status: implemented, file: alert.tsx }
    android: { status: implemented, file: AedstAlert.kt }
    apple:   { status: implemented, file: AedstAlert.swift }
    desktop: { status: implemented, file: aedst_alert.slint }
  alert-dialog:
