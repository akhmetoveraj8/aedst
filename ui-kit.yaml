# Kit files outside the canonical set, per platform (file names relative to the platform root). They are
# not part of the parity count. An extension that gets a shadcn name moves to `components`.
extensions:
  web:
    - attachment.tsx
    - bubble.tsx
    - direction.tsx
    - loading-skeleton.tsx
    - locale-select.tsx
    - marker.tsx
    - message.tsx
    - message-scroller.tsx
    - mode-toggle.tsx
    - questionnaire.tsx
  android:
    - AedstCountBadge.kt
    - AedstFab.kt
    - AedstFilterChip.kt
    - AedstIconButton.kt       # the canonical form is `button` with size `icon`
    - AedstOfflineBanner.kt
    - AedstTopAppBar.kt
    - ErrorMessages.kt
    - LoadingIndicator.kt
  apple:
    - AedstErrorPresenter.swift
    - AedstIconButton.swift    # the canonical form is `button` with size `icon`
  desktop:
    - aedst_action_row.slint
