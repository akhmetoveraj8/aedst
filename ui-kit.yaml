    sizes: []
    web:     { status: implemented, file: alert-dialog.tsx }
    android: { status: implemented, file: AedstAlertDialog.kt }
    apple:   { status: implemented, file: AedstAlertDialog.swift }
    desktop: { status: implemented, file: aedst_alert_dialog.slint }
  aspect-ratio:
    variants: []
    sizes: []
    web:     { status: implemented, file: aspect-ratio.tsx }
    android: { status: native, note: "Modifier.aspectRatio" }
    apple:   { status: implemented, file: AedstAspectRatio.swift }
    desktop: { status: implemented, file: aedst_aspect_ratio.slint }
  avatar:
    variants: []
    sizes: []
    # Web sizes the avatar with a `size` prop (default, sm, lg) written as `data-size`, not a `cva` axis, so
    # there is no canonical list to compare with. Android and Apple expose the sizes as an enum.
    deviations:
      android: { size: { values: [sm, md, lg], reason: "web has no cva size axis (data-size prop: default, sm, lg); the Compose kit exposes it as AedstAvatarSize and names the default size md" } }
      apple:   { size: { values: [sm, md, lg], reason: "web has no cva size axis (data-size prop: default, sm, lg); the SwiftUI kit exposes it as AedstAvatarSize and names the default size md" } }
    web:     { status: implemented, file: avatar.tsx }
    android: { status: implemented, file: AedstAvatar.kt }
    apple:   { status: implemented, file: AedstAvatar.swift }
    desktop: { status: implemented, file: aedst_avatar.slint }
  badge:
    variants: [default, secondary, destructive, success, warning, info, outline, ghost, link]
