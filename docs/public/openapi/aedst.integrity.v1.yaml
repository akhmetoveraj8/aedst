openapi: 3.1.0
info:
  title: AEDST integrity API (aedst.integrity.v1)
  description: Generated from apps/server/api/proto/aedst/integrity/v1. ConnectRPC over HTTP, one POST per RPC (GET where the RPC has no side effects). Do not edit by hand.
  version: v1
paths:
  /aedst.integrity.v1.IntegrityService/VerifyIntegrityToken:
    post:
      tags:
        - aedst.integrity.v1.IntegrityService
      summary: VerifyIntegrityToken
      description: |-
        Decodes a Play Integrity token with Google and applies the server policy.
         A token that fails the policy answers verified=false with a reason, not an error.
      operationId: aedst.integrity.v1.IntegrityService.VerifyIntegrityToken
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aedst.integrity.v1.VerifyIntegrityTokenRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aedst.integrity.v1.VerifyIntegrityTokenResponse'
components:
  schemas:
    aedst.integrity.v1.AccountVerdict:
      type: string
      title: AccountVerdict
      enum:
        - ACCOUNT_VERDICT_UNSPECIFIED
        - ACCOUNT_VERDICT_LICENSED
        - ACCOUNT_VERDICT_UNLICENSED
        - ACCOUNT_VERDICT_UNEVALUATED
    aedst.integrity.v1.AppVerdict:
      type: string
      title: AppVerdict
      enum:
        - APP_VERDICT_UNSPECIFIED
        - APP_VERDICT_PLAY_RECOGNIZED
        - APP_VERDICT_UNRECOGNIZED_VERSION
        - APP_VERDICT_UNEVALUATED
    aedst.integrity.v1.DeviceVerdict:
      type: string
      title: DeviceVerdict
      enum:
        - DEVICE_VERDICT_UNSPECIFIED
        - DEVICE_VERDICT_MEETS_BASIC_INTEGRITY
        - DEVICE_VERDICT_MEETS_DEVICE_INTEGRITY
        - DEVICE_VERDICT_MEETS_STRONG_INTEGRITY
        - DEVICE_VERDICT_MEETS_VIRTUAL_INTEGRITY
    aedst.integrity.v1.FailureReason:
      type: string
      title: FailureReason
      enum:
        - FAILURE_REASON_UNSPECIFIED
        - FAILURE_REASON_TOKEN_UNDECODABLE
        - FAILURE_REASON_REQUEST_HASH_MISMATCH
        - FAILURE_REASON_TOKEN_NOT_BOUND
        - FAILURE_REASON_PACKAGE_MISMATCH
        - FAILURE_REASON_TOKEN_EXPIRED
        - FAILURE_REASON_TOKEN_FROM_FUTURE
        - FAILURE_REASON_DEVICE_NOT_TRUSTED
        - FAILURE_REASON_APP_NOT_RECOGNIZED
        - FAILURE_REASON_NOT_LICENSED
        - FAILURE_REASON_TESTING_RESPONSE
        - FAILURE_REASON_TOKEN_REPLAYED
      description: Why verified is false. UNSPECIFIED when verified is true.
    aedst.integrity.v1.VerifyIntegrityTokenRequest:
      type: object
      properties:
        integrityToken:
          type: string
          title: integrity_token
          maxLength: 32768
          minLength: 1
          description: The opaque token from StandardIntegrityToken.token(). Never logged.
        action:
          type: string
          title: action
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9._-]*$
          description: What the token authorises, e.g. "login" or "purchase". Part of the bound hash.
        payload:
          type: string
          title: payload
          format: byte
          description: |
            Caller-chosen bytes the token is bound to (include a fresh nonce).
            bytes.max_len = 4096
        requestHash:
          type: string
          title: request_hash
          maxLength: 43
          minLength: 43
          pattern: ^[A-Za-z0-9_-]+$
          description: 'The value given to setRequestHash: base64url (no padding) SHA-256, 43 chars.'
        packageName:
          type: string
          title: package_name
          maxLength: 255
          pattern: ^([A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)*)?$
          description: |-
            The app's applicationId. Empty means "the only allowed package" and is
             rejected when AEDST_INTEGRITY_ALLOWED_PACKAGES lists several. Must be one
             of the allowed packages; Google also checks the token was minted for it.
      title: VerifyIntegrityTokenRequest
      additionalProperties: false
      description: |-
        Request binding convention (client and server must agree):

           request_hash = base64url_nopad(SHA-256("aedst.integrity.v1\n" + action + "\n" + payload))

         The client passes request_hash to the Play Integrity request
         (StandardIntegrityTokenRequest.setRequestHash) and sends action + payload
         here; the server recomputes the hash and requires that both request_hash and
         the hash Google returns inside the signed verdict equal it. payload is
         whatever the client wants the token bound to (a request body digest plus a
         fresh random nonce, for example) and is never stored.
    aedst.integrity.v1.VerifyIntegrityTokenResponse:
      type: object
      properties:
        verified:
          type: boolean
          title: verified
        reason:
          title: reason
          $ref: '#/components/schemas/aedst.integrity.v1.FailureReason'
        deviceVerdicts:
          type: array
          items:
            $ref: '#/components/schemas/aedst.integrity.v1.DeviceVerdict'
          title: device_verdicts
          description: What Google reported (present whenever the token was decoded).
        appVerdict:
          title: app_verdict
          $ref: '#/components/schemas/aedst.integrity.v1.AppVerdict'
        accountVerdict:
          title: account_verdict
          $ref: '#/components/schemas/aedst.integrity.v1.AccountVerdict'
        action:
          type: string
          title: action
          description: Echo of the verified action (empty when not verified).
        tokenIssuedAt:
          title: token_issued_at
          description: When Google minted the token.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: VerifyIntegrityTokenResponse
      additionalProperties: false
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
security: []
tags:
  - name: aedst.integrity.v1.IntegrityService
    description: |-
      IntegrityService verifies Google Play Integrity (STANDARD API) tokens
       minted by the Android app (core/security PlayIntegrityFacade). The server
       decodes the token with Google (playintegrity.googleapis.com
       v1/{package}:decodeIntegrityToken), then applies its own policy: package
       name, freshness, request binding, device/app/licensing verdicts, replay.

       Authenticated callers only. Disabled until AEDST_INTEGRITY_ENABLED=true
       (FAILED_PRECONDITION while disabled). A token that fails the policy is NOT
       an RPC error: the call succeeds with verified=false and a reason, so the
       client can decide what to do (block, degrade, ask for a retry).
