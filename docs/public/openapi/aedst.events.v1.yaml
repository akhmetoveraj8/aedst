openapi: 3.1.0
info:
  title: AEDST events API (aedst.events.v1)
  description: Generated from apps/server/api/proto/aedst/events/v1. ConnectRPC over HTTP, one POST per RPC (GET where the RPC has no side effects). Do not edit by hand.
  version: v1
paths:
  /aedst.events.v1.EventIngestService/Deliver:
    post:
      tags:
        - aedst.events.v1.EventIngestService
      summary: Deliver
      description: |-
        Deliver records one event delivery for one consumer. It is idempotent on
         (consumer, event_id): replaying it (the producer retries after a lost
         response) never creates a second delivery. An unknown consumer is NOT_FOUND
         and a malformed envelope INVALID_ARGUMENT; both are permanent, the producer
         does not retry them.
      operationId: aedst.events.v1.EventIngestService.Deliver
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aedst.events.v1.DeliverRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aedst.events.v1.DeliverResponse'
components:
  schemas:
    aedst.events.v1.DeliverRequest:
      type: object
      properties:
        consumer:
          type: string
          title: consumer
          maxLength: 128
          minLength: 3
          description: Stable consumer name "<unit>.<name>", e.g. "notifications.task_completed".
        eventId:
          type: string
          title: event_id
          format: uuid
          description: Event id (UUID), stable across redeliveries; the consumer dedupes on it.
        eventType:
          type: string
          title: event_type
          maxLength: 128
          minLength: 1
          description: Event type, e.g. "tasks.v1.TaskCompleted".
        eventVersion:
          type: integer
          title: event_version
        occurredAt:
          title: occurred_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        partitionKey:
          type: string
          title: partition_key
          format: uuid
          description: Aggregate id (UUID) the event is partitioned by.
        traceparent:
          type: string
          title: traceparent
          maxLength: 128
          description: W3C traceparent of the originating request; empty if none.
        payload:
          type: string
          title: payload
          format: byte
          description: |
            The event payload exactly as the producing module serialised it (JSON).
            bytes.max_len = 262144
      title: DeliverRequest
      required:
        - occurredAt
      additionalProperties: false
    aedst.events.v1.DeliverResponse:
      type: object
      properties:
        created:
          type: boolean
          title: created
          description: True when this call created the delivery, false when it already existed.
      title: DeliverResponse
      additionalProperties: false
    aedst.events.v1.EventEnvelope:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |-
            Event id (UUIDv7). Stable across redeliveries: it is the JetStream
             Nats-Msg-Id and the key every consumer and client dedupes on.
        type:
          type: string
          title: type
          description: Event type, e.g. "tasks.v1.TaskCompleted".
        version:
          type: integer
          title: version
          description: Version of the payload format of this event type (starts at 1).
        occurredAt:
          title: occurred_at
          description: When the producing transaction recorded the event (UTC).
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        partitionKey:
          type: string
          title: partition_key
          description: |-
            Aggregate id (UUID) the event is partitioned by, e.g. the task id. It is
             not the recipient.
        payload:
          type: string
          title: payload
          format: byte
          description: |-
            The event payload exactly as the producing module serialised it: a UTF-8
             JSON object, pinned by that module's golden fixtures. It stays JSON because
             clients receive it unchanged.
      title: EventEnvelope
      additionalProperties: false
      description: |-
        EventEnvelope is the body of an integration event that leaves the Go server
         on NATS JetStream for a service written in another language (today the Rust
         realtime gateway, apps/gateway; ADR-0021, ADR-0026). The Go bridge
         (internal/platform/natsbridge) encodes it in the binary Protobuf format; the
         gateway decodes it with code generated from this file at build time, so the
         two sides cannot drift without `buf breaking` noticing.

         The recipient is not in the envelope: it travels in the NATS subject
         (aedst.events.user.<user id>.<event type>), so routing never changes the body.

         Compatibility: fields are only added. A consumer ignores fields it does not
         know (Protobuf does that by itself).
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
security: []
tags:
  - name: aedst.events.v1.EventIngestService
    description: |-
      EventIngestService is the wire contract for an integration event that crosses a
       database boundary (ADR-0022). A producer whose consumer lives in another
       service does not insert the consumer's delivery in its own River tables: it
       inserts a platform.event_forward job in the same transaction as the state
       change, and that job calls Deliver on the consumer's service. The consumer's
       service inserts the real delivery job in its own database, so each side keeps
       its own outbox and retry lifecycle and no distributed transaction exists.

       The service is closed to users: only the machine identity (role "internal",
       see AEDST_SERVICE_IDENTITY_*) may call it, and it is mounted only when
       AEDST_EVENTS_INGEST_ENABLED is true. The event payload stays the JSON the
       producing module serialises (pinned by its golden fixtures); this envelope is
       what buf breaking guards.
