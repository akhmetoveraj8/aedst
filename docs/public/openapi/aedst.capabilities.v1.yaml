openapi: 3.1.0
info:
  title: AEDST capabilities API (aedst.capabilities.v1)
  description: Generated from apps/server/api/proto/aedst/capabilities/v1. ConnectRPC over HTTP, one POST per RPC (GET where the RPC has no side effects). Do not edit by hand.
  version: v1
paths:
  /aedst.capabilities.v1.CapabilitiesService/GetCapabilities:
    get:
      tags:
        - aedst.capabilities.v1.CapabilitiesService
      summary: |-
        Returns the server identity, the supported client releases and the enabled
         features. Public and independent of the caller's identity.
      description: |-
        No side effects, so it is also served as a Connect GET and is the reference
         cacheable read: the response carries a strong ETag and
         "Cache-Control: public, max-age=..." and If-None-Match is answered 304
         (modulekit.Cacheable). The answer varies by X-Aedst-Client only.
      operationId: aedst.capabilities.v1.CapabilitiesService.GetCapabilities.get
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
        - name: message
          in: query
          description: The URL-encoded message query parameter contains the JSON or binary serialized request message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aedst.capabilities.v1.GetCapabilitiesRequest'
        - name: encoding
          in: query
          description: Define which encoding or 'Message-Codec' to use
          required: true
          schema:
            $ref: '#/components/schemas/encoding'
          example: json
        - name: base64
          in: query
          description: Specifies if the message query param is base64 encoded, which may be required for binary data
          schema:
            $ref: '#/components/schemas/base64'
          example: false
        - name: compression
          in: query
          description: Which compression algorithm to use for this request
          schema:
            $ref: '#/components/schemas/compression'
          example: gzip
        - name: connect
          in: query
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect'
          example: v1
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aedst.capabilities.v1.GetCapabilitiesResponse'
    post:
      tags:
        - aedst.capabilities.v1.CapabilitiesService
      summary: |-
        Returns the server identity, the supported client releases and the enabled
         features. Public and independent of the caller's identity.
      description: |-
        No side effects, so it is also served as a Connect GET and is the reference
         cacheable read: the response carries a strong ETag and
         "Cache-Control: public, max-age=..." and If-None-Match is answered 304
         (modulekit.Cacheable). The answer varies by X-Aedst-Client only.
      operationId: aedst.capabilities.v1.CapabilitiesService.GetCapabilities
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aedst.capabilities.v1.GetCapabilitiesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aedst.capabilities.v1.GetCapabilitiesResponse'
components:
  schemas:
    aedst.capabilities.v1.ClientVersions:
      type: object
      properties:
        minimum:
          type: string
          title: minimum
          description: The oldest supported release; older ones are rejected.
        recommended:
          type: string
          title: recommended
          description: The release clients should move to.
      title: ClientVersions
      additionalProperties: false
      description: ClientVersions is the support window of one platform. Empty = not configured.
    aedst.capabilities.v1.Feature:
      type: object
      properties:
        enabled:
          type: boolean
          title: enabled
        params:
          type: object
          title: params
          additionalProperties:
            type: string
            title: value
          description: Free-form, feature-specific settings (all values are strings).
        requiredClientVersion:
          type: string
          title: required_client_version
          description: Semver; empty = no requirement. Clients older than this hide the feature.
      title: Feature
      additionalProperties: false
      description: |-
        Feature is one switchable capability.

         Client rule (all four platforms): a feature the server lists is authoritative.
         `enabled = false` always wins, even for a feature the client has built.
         `required_client_version` (semver, empty = none) hides the feature on clients
         older than it. A feature the server does NOT list falls back to the client's
         default: a built-in feature (tasks, search, ...) is on, a flagged (optional,
         experimental) feature is off.

         Names without a dot are coarse feature ids: one per server module ("tasks",
         "media", "search", "admin", "notifications", "auth", ...), enabled when the
         module is registered and not switched off by the operator, plus operator flags.
         Dotted names ("media.uploads", "push.fcm") are sub-capabilities derived from
         what this deployment has configured.
    aedst.capabilities.v1.GetCapabilitiesRequest:
      type: object
      title: GetCapabilitiesRequest
      additionalProperties: false
    aedst.capabilities.v1.GetCapabilitiesResponse:
      type: object
      properties:
        serverVersion:
          type: string
          title: server_version
          description: The running server build (semver, a commit hash, or "dev").
        clients:
          type: object
          title: clients
          additionalProperties:
            title: value
            $ref: '#/components/schemas/aedst.capabilities.v1.ClientVersions'
          description: 'Support window per platform: "web", "android", "apple", "desktop".'
        features:
          type: object
          title: features
          additionalProperties:
            title: value
            $ref: '#/components/schemas/aedst.capabilities.v1.Feature'
          description: |-
            Coarse module ids ("tasks"), dotted sub-capabilities ("media.uploads") and
             operator flags ("new_search"). See Feature for how clients treat a feature
             that is not listed.
        updateStatus:
          title: update_status
          description: The caller's own standing, from its X-Aedst-Client header.
          $ref: '#/components/schemas/aedst.capabilities.v1.UpdateStatus'
      title: GetCapabilitiesResponse
      additionalProperties: false
    aedst.capabilities.v1.UpdateStatus:
      type: string
      title: UpdateStatus
      enum:
        - UPDATE_STATUS_UNSPECIFIED
        - UPDATE_STATUS_CURRENT
        - UPDATE_STATUS_RECOMMENDED
      description: |-
        UpdateStatus is how the calling client's release compares with the policy.
         A release below the minimum never gets this far: the version gate rejects the
         call with CLIENT_UPGRADE_REQUIRED first.
    base64:
      type: boolean
      examples:
        - false
      title: base64
      description: Specifies if the message query param is base64 encoded, which may be required for binary data
    compression:
      examples:
        - gzip
      title: compression
      enum:
        - identity
        - gzip
        - br
      description: Which compression algorithm to use for this request
    connect:
      examples:
        - v1
      title: connect
      enum:
        - v1
      description: Define the version of the Connect protocol
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    encoding:
      examples:
        - json
      title: encoding
      enum:
        - proto
        - json
      description: Define which encoding or 'Message-Codec' to use
security: []
tags:
  - name: aedst.capabilities.v1.CapabilitiesService
    description: |-
      CapabilitiesService is capability negotiation: what this server is, which
       client releases it supports, and which features it has switched on. Clients
       (web, android, apple, desktop) call it at start-up and on resume, before
       sign-in, and gate UI on the answer instead of guessing from the API version.

       Public (no token) and read-only. The caller identifies itself with the
       X-Aedst-Client header ("<platform>/<semver>", ADR-0009); the answer never
       depends on who the user is, so it is safe to cache for a few minutes.

       Compatibility: fields are only added. A client ignores feature names it does
       not know and treats a missing feature as disabled.
