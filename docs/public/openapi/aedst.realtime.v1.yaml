        - name: connect
          in: query
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect'
          example: v1
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aedst.realtime.v1.GetConnectionAccessResponse'
    post:
      tags:
        - aedst.realtime.v1.RealtimeService
      summary: GetConnectionAccess
      description: |-
        Returns the owner id the caller's events are addressed to and the instant
         the caller's access token expires, at which the gateway closes the socket.
         Reads only the verified token: no database access, no side effects.
