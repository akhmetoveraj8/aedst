info:
  title: AEDST realtime API (aedst.realtime.v1)
  description: Generated from apps/server/api/proto/aedst/realtime/v1. ConnectRPC over HTTP, one POST per RPC (GET where the RPC has no side effects). Do not edit by hand.
  version: v1
paths:
